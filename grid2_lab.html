<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GRID 2 — layout lab</title>

<style>
/* ============================================================================
   GRID 2 LAB — H/V duality.
   Landscape (_h, "desktop"): six panels, one active, buffer/gap switch engine,
     side menu, custom scrollbar.  (unchanged mechanic)
   Portrait  (_v, "mobile"):  all CORES stacked in one flex column with gaps,
     native scroll, side menu hidden → hamburger popup (bottom-right),
     custom scrollbar hidden.
   Same CORES feed both modes (source: content/<id>.html → inline CONTENT).
   Mode is chosen by orientation and rebuilt live on rotate.
   The magenta/green/red tints are DEBUG only.
   ============================================================================ */

/* ============================================================================
   ★ CONTROL PANEL (CSS) ★  :root = landscape (_h) values; the
   @media (orientation: portrait) block near the bottom holds the _v overrides.
   ============================================================================ */
:root{
  /* -- Region heights (_h) -- */
  --gap-before:    calc(100dvh / 6);
  --gap-after:     calc(100dvh / 6);
  --buffer-before: calc(100dvh / 3);
  --buffer-after:  calc(100dvh / 2);

  /* -- CORE min-height (_h) -- */
  --min-height-default: calc(100dvh - var(--gap-before) - var(--gap-after));
  /* --min-height-custom: 70dvh;   ← set a dvh value to override; comment for default */

  /* -- Switch indicator (_h) -- */
  --ind-bar-width: clamp(120px, 16dvw, 240px);

  /* -- MOBILE (_v) content stack -- */
  --gap-mobile:       calc(100dvh / 6);   /* between cores */
  --gap-mobile-first: calc(100dvh / 6);   /* before first core */
  --gap-mobile-last:  calc(100dvh / 6);   /* after last core */
  --m-pad-x:          calc(100dvw / 8);   /* stack container left/right padding */
  --m-popup-inset:    33dvh calc(100dvw/16) calc(100dvw/16) 33dvw;  /* top right bottom left */

  /* -- Menu item modifiers (shared) -- */
  --mi-font-size:   1.5rem;
  --mi-line-height: 1.1em;
  --mi-align:       right;
  --mi-pad-y:       0px;
  --mi-pad-x:       0px;

  /* -- Lab cosmetics -- */
  --c-panel-bg: #f5f5f5;
  --c-turquoise:#29d6d6;
  --c-red:      #e11d1d;
  --c-ink:      #111;
  --t-buffer: rgba(255, 0, 255, .16);
  --t-gap:    rgba(0, 210, 0, .20);
  --t-core:   rgba(255, 0, 0, .10);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }

.screen{
  position:relative; width:100dvw; height:100dvh; overflow:hidden;
  background:#eef3f6; font-family:'Fira Sans Extra Condensed', system-ui, sans-serif;
}
.lab-tag{
  position:absolute; top:10px; left:12px; z-index:30;
  font:600 12px/1 'Fira Sans Extra Condensed', system-ui, sans-serif;
  letter-spacing:.04em; color:#4a5560; opacity:.7; pointer-events:none;
}

/* ===================== shared CORE typography ============================= */
.core .panel-title, .core h1, .m-core h1{
  margin:0 0 0.6em; font-weight:700; line-height:1.15; font-size:clamp(22px, 2.4dvw, 40px);
}
.core p, .m-core p{ margin:0 0 1em; }
.core > *:last-child, .m-core > *:last-child{ margin-bottom:0; }

/* ===================== DESKTOP ( _h ) ==================================== */
.mobile-root{ display:none; }

.anchored{ position:absolute; width:var(--w); height:var(--h);
  left:calc(var(--ax) - var(--w) / 2); top:var(--ay); }

.menu{
  --w: calc(100dvw*1/6); --h: calc(100dvh*2/5); --ax: calc(100dvw*1/4); --ay: calc(100dvh*1/6);
  padding: calc(var(--w) / 5); background:var(--c-turquoise);
  display:flex; flex-direction:column; justify-content:flex-start; overflow:hidden;
}
.menu-item{
  display:block; width:100%; margin:0; padding: var(--mi-pad-y) var(--mi-pad-x);
  background:none; border:none; cursor:pointer; font-family:inherit; color:var(--c-ink);
  font-size:var(--mi-font-size); line-height:var(--mi-line-height); text-align:var(--mi-align);
}
.menu-item:hover{ text-decoration:underline; }
.menu-item.active{ font-weight:700; }

.viewport{
  --w: calc(100dvw*2/5); --h: 100dvh; --ax: calc(100dvw*11/16); --ay: 0dvh;
  --pad-x: 0px; margin:0; padding:0; background:var(--c-panel-bg); overflow:hidden;
}
.panel{ position:absolute; inset:0; margin:0; padding:0; overflow-y:auto; scrollbar-width:none; display:none; }
.panel::-webkit-scrollbar{ display:none; }
.panel.active{ display:block; }
.panel.settling{ overflow:hidden; }
.content{ width:100%; display:flex; flex-direction:column; }
.content > *{ flex-shrink:0; }

.buffer{ position:relative; width:100%; background:var(--t-buffer);
  display:flex; flex-direction:column; align-items:center; }
.buffer-before{ height:var(--buffer-before); justify-content:flex-end; }
.buffer-after{  height:var(--buffer-after);  justify-content:flex-start; }
.gap{ width:100%; background:var(--t-gap); }
.gap-before{ height:var(--gap-before); }
.gap-after{  height:var(--gap-after); }
.core{
  width:100%; padding:0; display:flow-root;
  min-height: var(--min-height-custom, var(--min-height-default));
  background:var(--t-core); color:var(--c-ink); line-height:1.5; font-size:clamp(13px, 1.1dvw, 18px);
}
.switch-indicator{
  display:flex; flex-direction:column; align-items:center; gap:.5em;
  font:600 clamp(13px,1.2dvw,18px)/1.2 'Fira Sans Extra Condensed', system-ui, sans-serif;
  color:var(--c-ink); text-align:center; white-space:nowrap; opacity:0; pointer-events:none;
}
.switch-indicator.show{ opacity:1; }
.switch-indicator .si-label{ opacity:0; }
.switch-indicator .si-bar{ position:relative; width:var(--ind-bar-width); height:3px;
  background:rgba(0,0,0,.2); border-radius:2px; overflow:hidden; }
.switch-indicator .si-bar > i{ position:absolute; inset:0; transform-origin:left center; transform:scaleX(0); background:#7a0000; }

.scrollbar{
  --w: clamp(3px,0.35dvw,6px); --h: calc(100dvh*2/5); --ax: calc(100dvw*15/16); --ay: calc(100dvh*1/6);
  background:var(--c-red); border-radius:999px; cursor:pointer;
}
.scrollbar .thumb{ position:absolute; left:50%; transform:translateX(-50%);
  width:calc(clamp(3px,0.35dvw,6px) * 2.4); height:24px; top:0;
  background:#7a0000; border-radius:999px; cursor:grab; touch-action:none; }
.scrollbar .thumb.dragging{ cursor:grabbing; }

/* ===================== MOBILE ( _v ) ===================================== */
.m-viewport{ position:absolute; inset:0; overflow-y:auto; padding:0 var(--m-pad-x); background:var(--c-panel-bg); }
.m-core{ width:100%; display:flow-root; background:var(--t-core);
  color:var(--c-ink); line-height:1.5; font-size:clamp(15px, 4dvw, 22px); }
.gap-mobile{       height:var(--gap-mobile);       background:var(--t-gap); }
.gap-mobile-first{ height:var(--gap-mobile-first); background:var(--t-gap); }
.gap-mobile-last{  height:var(--gap-mobile-last);  background:var(--t-gap); }

.m-hamburger{ position:fixed; right:16px; bottom:16px; z-index:22;
  width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
  background:var(--c-turquoise); color:#012; font-size:26px; line-height:1;
  box-shadow:0 2px 8px rgba(0,0,0,.25); }
.m-popup{ position:fixed; inset:var(--m-popup-inset); z-index:21;
  background:var(--c-turquoise); box-shadow:0 2px 16px rgba(0,0,0,.3);
  display:flex; flex-direction:column; justify-content:center; gap:.4em; padding:1em; overflow:auto; }
.m-popup[hidden]{ display:none; }
.m-popup .menu-item{ text-align:center; font-size:clamp(18px,6dvw,28px); line-height:1.4; }

/* ---- orientation switch ---- */
@media (orientation: portrait){
  .desktop-root{ display:none; }
  .mobile-root{ display:block; }
  /* _v parameter overrides go here (same as _h for now) */
}
</style>
</head>
<body>
  <div class="screen">
    <span class="lab-tag">GRID 2 · layout lab</span>

    <div class="desktop-root" id="desktopRoot">
      <nav class="anchored menu" id="menu" aria-label="Menu"></nav>
      <div class="anchored viewport" id="viewport"></div>
      <div class="anchored scrollbar" id="scrollbar"><div class="thumb" id="thumb"></div></div>
    </div>

    <div class="mobile-root" id="mobileRoot">
      <div class="m-viewport" id="mViewport"></div>
      <button class="m-hamburger" id="mHamburger" type="button" aria-label="Menu">☰</button>
      <div class="m-popup" id="mPopup" hidden></div>
    </div>
  </div>

  <script>
  (function(){
    /* ---------- shared data / CORE source ---------- */
    var SECTIONS = [
      { id:'program',   label:'Program',      src:'content/program.html' },
      { id:'dresscode', label:'Dress Code',   src:'content/dresscode.html' },
      { id:'dary',      label:'Dary',         src:'content/dary.html' },
      { id:'faq',       label:'Časté otázky', src:'content/faq.html' },
      { id:'blog',      label:'Blog',         src:'content/blog.html' },
      { id:'kontakt',   label:'Kontakt',      src:'content/kontakt.html' }
    ];
    var LOREM = [
      'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.',
      'Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.',
      'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.',
      'Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.',
      'Curabitur pretium tincidunt lacus. Nulla gravida orci a odio. Nullam varius, turpis et commodo pharetra, est eros bibendum elit.',
      'Vivamus euismod mauris. In ut quam vitae odio lacinia tincidunt. Praesent ut ligula non mi varius sagittis.',
      'Sed dignissim lacinia nunc. Curabitur tortor. Pellentesque nibh. Aenean quam. In scelerisque sem at dolor.',
      'Maecenas mattis. Sed convallis tristique sem. Proin ut ligula vel nunc egestas porttitor.',
      'Morbi lectus risus, iaculis vel, suscipit quis, luctus non, massa. Fusce ac turpis quis ligula lacinia aliquet.',
      'Mauris ipsum. Nulla metus metus, ullamcorper vel, tincidunt sed, euismod in, nibh. Quisque volutpat condimentum velit.'
    ].map(function(t){ return '<p>'+t+'</p>'; }).join('');
    function FRAG(title){ return '<h1>'+title+'</h1>'+LOREM; }
    var CONTENT = {
      program:FRAG('Program'), dresscode:FRAG('Dress Code'), dary:FRAG('Dary'),
      faq:FRAG('Časté otázky'), blog:FRAG('Blog'), kontakt:FRAG('Kontakt')
    };
    var clamp=function(v,a,b){ return Math.min(Math.max(v,a),b); };

    /* ============================================================
       DESKTOP ENGINE ( _h )
       ============================================================ */
    function buildDesktop(){
      var ac=new AbortController(), sig={signal:ac.signal};
      var CONFIG={
        cooldownMs:450, edgeEps:2,
        indBeforeTextFinish:0.80, indBeforeBarFinish:0.80,
        indAfterTextFinish:0.80,  indAfterBarFinish:0.80,
        'switch-indicator_copy_before_generic':'↑ Späť: ',
        'switch-indicator_copy_after_generic' :'↓ Ďalej: ',
        labelTop:'↑ Navrch'
      };
      var menu=document.getElementById('menu'), frame=document.getElementById('viewport'),
          track=document.getElementById('scrollbar'), thumb=document.getElementById('thumb');
      var items=[],panels=[],info=[],savedScroll=[],active=0,metricsActive=null,settling=false,settleTimer=null;

      SECTIONS.forEach(function(s,i){
        var last=(i===SECTIONS.length-1);
        var btn=document.createElement('button'); btn.type='button'; btn.className='menu-item'; btn.textContent=s.label;
        btn.addEventListener('click', function(){ activate(i,false); }, sig);
        menu.appendChild(btn); items.push(btn);

        var nameBefore=(i>0)?SECTIONS[i-1].label:'', nameAfter=(!last)?SECTIONS[i+1].label:'';
        var backLabel=(i>0)?(CONFIG['switch-indicator_copy_before_generic']+nameBefore):CONFIG.labelTop;
        var nextLabel=(!last)?(CONFIG['switch-indicator_copy_after_generic']+nameAfter):'';
        var ind=function(cls,label){ return '<div class="switch-indicator '+cls+'"><span class="si-label">'+label+'</span><span class="si-bar"><i></i></span></div>'; };

        var panel=document.createElement('section'); panel.className='panel'; panel.id='panel-'+s.id;
        panel.innerHTML='<div class="content">'+
          '<div class="buffer buffer-before">'+ind('ind-back',backLabel)+'</div>'+
          '<div class="gap gap-before"></div>'+
          '<div class="core"></div>'+
          '<div class="gap gap-after"></div>'+
          (last?'':'<div class="buffer buffer-after">'+ind('ind-next',nextLabel)+'</div>')+
        '</div>';
        frame.appendChild(panel); panels.push(panel);
        info.push({ indBack:panel.querySelector('.ind-back'), indNext:panel.querySelector('.ind-next') });
        savedScroll.push(null);
        panel.addEventListener('scroll', function(){ if(i===active) onScroll(); }, {passive:true, signal:ac.signal});
      });

      function measure(sel){ var e=panels[active].querySelector(sel); return e?e.offsetHeight:0; }
      function computeMetrics(){ metricsActive={ bufferBefore:measure('.buffer-before'), gapBefore:measure('.gap-before'),
        core:measure('.core'), gapAfter:measure('.gap-after'), bufferAfter:measure('.buffer-after') }; }
      function setAnim(indEl,p,tf,bf){ indEl.classList.toggle('show',p>0);
        indEl.querySelector('.si-label').style.opacity=clamp(p/tf,0,1);
        indEl.querySelector('.si-bar > i').style.transform='scaleX('+clamp(p/bf,0,1)+')'; }
      function updateIndicators(){ var vp=panels[active],m=metricsActive,max=vp.scrollHeight-vp.clientHeight,it=info[active];
        if(it.indBack && m.bufferBefore>0) setAnim(it.indBack, clamp((m.bufferBefore-vp.scrollTop)/m.bufferBefore,0,1), CONFIG.indBeforeTextFinish, CONFIG.indBeforeBarFinish);
        if(it.indNext && m.bufferAfter>0) setAnim(it.indNext, clamp((vp.scrollTop-(max-m.bufferAfter))/m.bufferAfter,0,1), CONFIG.indAfterTextFinish, CONFIG.indAfterBarFinish); }
      function readingRange(){ var vp=panels[active],m=metricsActive,max=vp.scrollHeight-vp.clientHeight;
        return { top:m.bufferBefore, bot:Math.max(m.bufferBefore,max-m.bufferAfter), reading:(m.gapBefore+m.core+m.gapAfter) }; }
      function updateThumb(){ var vp=panels[active],r=readingRange();
        var ratio=Math.min(1, vp.clientHeight/Math.max(1,r.reading));
        var th=Math.max(24, Math.round(track.clientHeight*ratio)); thumb.style.height=th+'px';
        var span=Math.max(1,r.bot-r.top), p=clamp((vp.scrollTop-r.top)/span,0,1);
        thumb.style.top=(p*(track.clientHeight-th)).toFixed(1)+'px'; }
      function onScroll(){ if(settling) return; var vp=panels[active],m=metricsActive,max=vp.scrollHeight-vp.clientHeight;
        updateIndicators(); updateThumb();
        if(m.bufferAfter>0 && active<panels.length-1 && vp.scrollTop>=max-CONFIG.edgeEps) activate(active+1,true);
        else if(active>0 && vp.scrollTop<=CONFIG.edgeEps) activate(active-1,true); }
      function activate(i,reset){ var prev=active;
        if(panels[prev]&&panels[prev].classList.contains('active')) savedScroll[prev]=reset?null:panels[prev].scrollTop;
        active=i;
        items.forEach(function(b,j){ b.classList.toggle('active',j===i); });
        panels.forEach(function(p,j){ p.classList.toggle('active',j===i); });
        computeMetrics();
        var def=metricsActive.bufferBefore, max=Math.max(0,panels[i].scrollHeight-panels[i].clientHeight);
        var want=(reset||savedScroll[i]==null)?def:savedScroll[i];
        panels[i].scrollTop=clamp(want,0,max); savedScroll[i]=panels[i].scrollTop;
        panels[i].style.transition='none'; panels[i].style.transform='';
        updateIndicators(); updateThumb();
        settling=true; panels[i].classList.add('settling'); clearTimeout(settleTimer);
        settleTimer=setTimeout(function(){ settling=false; panels[i].classList.remove('settling'); }, CONFIG.cooldownMs); }

      var dragging=false,startPtrY=0,startTop=0;
      function scrollFromThumb(topPx){ var vp=panels[active],r=readingRange(),travel=track.clientHeight-thumb.clientHeight;
        var p=travel>0?clamp(topPx,0,travel)/travel:0; vp.scrollTop=r.top+p*(r.bot-r.top); }
      thumb.addEventListener('pointerdown', function(e){ e.preventDefault(); dragging=true; thumb.classList.add('dragging'); thumb.setPointerCapture(e.pointerId); startPtrY=e.clientY; startTop=parseFloat(thumb.style.top)||0; }, sig);
      thumb.addEventListener('pointermove', function(e){ if(dragging) scrollFromThumb(startTop+(e.clientY-startPtrY)); }, sig);
      thumb.addEventListener('pointerup', function(){ dragging=false; thumb.classList.remove('dragging'); }, sig);
      thumb.addEventListener('pointercancel', function(){ dragging=false; thumb.classList.remove('dragging'); }, sig);
      track.addEventListener('pointerdown', function(e){ if(e.target===thumb) return; var rect=track.getBoundingClientRect(); scrollFromThumb((e.clientY-rect.top)-thumb.clientHeight/2); }, sig);

      window.addEventListener('wheel', function(e){
        if(dragging) return;
        if(settling){ e.preventDefault(); return; }
        var vp=panels[active];
        if(vp.contains(e.target)) return;
        e.preventDefault();
        var f=e.deltaMode===1?16:(e.deltaMode===2?vp.clientHeight:1);
        vp.scrollTop+=e.deltaY*f;
      }, {passive:false, signal:ac.signal});
      window.addEventListener('resize', function(){ computeMetrics(); updateIndicators(); updateThumb(); }, sig);

      function loadContent(i){ panels[i].querySelector('.core').innerHTML=CONTENT[SECTIONS[i].id]||('<h1>'+SECTIONS[i].label+'</h1>');
        if(i===active){ computeMetrics(); var max=Math.max(0,panels[i].scrollHeight-panels[i].clientHeight);
          panels[i].scrollTop=Math.min(metricsActive.bufferBefore,max); savedScroll[i]=panels[i].scrollTop; updateIndicators(); updateThumb(); } }

      activate(0,false);
      SECTIONS.forEach(function(s,i){ loadContent(i); });

      return { mode:'h', destroy:function(){ ac.abort(); clearTimeout(settleTimer); menu.innerHTML=''; frame.innerHTML=''; } };
    }

    /* ============================================================
       MOBILE ENGINE ( _v )
       ============================================================ */
    function buildMobile(){
      var ac=new AbortController(), sig={signal:ac.signal};
      var mv=document.getElementById('mViewport'), ham=document.getElementById('mHamburger'), pop=document.getElementById('mPopup');

      var html='<div class="gap-mobile-first"></div>';
      SECTIONS.forEach(function(s,i){
        html+='<div class="m-core" id="mcore-'+s.id+'">'+(CONTENT[s.id]||('<h1>'+s.label+'</h1>'))+'</div>';
        if(i<SECTIONS.length-1) html+='<div class="gap-mobile"></div>';
      });
      html+='<div class="gap-mobile-last"></div>';
      mv.innerHTML=html;

      pop.innerHTML=SECTIONS.map(function(s){ return '<button type="button" class="menu-item" data-target="mcore-'+s.id+'">'+s.label+'</button>'; }).join('');
      pop.hidden=true;

      ham.addEventListener('click', function(){ pop.hidden=!pop.hidden; }, sig);
      pop.addEventListener('click', function(e){ var b=e.target.closest('.menu-item'); if(!b) return;
        var t=document.getElementById(b.getAttribute('data-target')); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); pop.hidden=true; }, sig);

      return { mode:'v', destroy:function(){ ac.abort(); mv.innerHTML=''; pop.innerHTML=''; pop.hidden=true; } };
    }

    /* ============================================================
       MODE CONTROLLER — orientation, live switch
       ============================================================ */
    var mq=window.matchMedia('(orientation: portrait)');
    var current=null;
    function setMode(){ var m=mq.matches?'v':'h'; if(current&&current.mode===m) return; if(current) current.destroy();
      current = m==='v' ? buildMobile() : buildDesktop(); }
    if(mq.addEventListener) mq.addEventListener('change', setMode); else mq.addListener(setMode);
    setMode();
  })();
  </script>
</body>
</html>

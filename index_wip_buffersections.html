<!-- ============================================================================
     ★ CONTROL PANEL  — GENERAL CONTROLS ★
     Site-wide switches.
       defaultTheme : theme the site OPENS in before the visitor toggles
                      ('light' or 'dark'). Orientation-independent (no _h/_v).
       fillParallaxGaps     : parallax "fill the gaps" — raise a plane's height so its
                      width reaches the screen sides (only ever RAISES height,
                      never lowers your tuned values).
       maxParallaxHeight100 : cap parallax height at 100% of screen height (stops a plane
                      from exceeding the screen on extreme aspect ratios).
     ORIENTATION: fillParallaxGaps / maxParallaxHeight100 have _h (landscape) and _v (portrait)
     variants; defaultTheme is a single global value.
     ============================================================================ -->
<script>
  window.GENERAL = {

    defaultTheme: 'light',

    fillParallaxGaps_h: true,
    fillParallaxGaps_v: true,

    maxParallaxHeight100_h: false,
    maxParallaxHeight100_v: false
  };
</script>

<!-- Set the theme BEFORE first paint (from GENERAL.defaultTheme) so there's no flash. -->
<script>
  try {
    var d = (window.GENERAL && window.GENERAL.defaultTheme) || 'light';
    document.documentElement.setAttribute('data-theme', localStorage.getItem('pf-theme') || d);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>

<!-- ============================================================================
     ★ CONTROL PANEL  — PARALLAX CONTROLS ★
     Parallax planes only. parallax_01 (frontmost) … 07 (backmost). Units = dvh.
     sky_01 is a parallax plane too, but it lives INSIDE the BG layer (fixed,
     full-screen backdrop) so it sits behind every mountain plane. Same controls
     as the others. Raise its heightAlt to make the sky fill more of the screen.

     SIZE:
       masterHeight : image HEIGHT as % of screen height, pinned to the frame
                      bottom (width follows the image's aspect, so it may overflow
                      the sides or leave gaps). e.g. 33 = each plane is 33% tall.
       heightAlt    : per-plane tweak; final height = masterHeight + heightAlt.

     HORIZONTAL ANCHOR (left-right placement when the image is wider than the screen):
       anchorImageX  : the point ON THE IMAGE (% of image width; 50 = centre).
       anchorScreenX : where that point lands ON SCREEN (% of screen width).
                       50/50 = centred crop. e.g. 75/75 keeps the image's 75% point
                       at 75% of the screen. PER-PLANE — each image placed independently.

     MOTION (image's BOTTOM edge; + = ABOVE frame bottom = UP, − = BELOW = DOWN):
       start        : position at page TOP (no scroll). 0 = on the frame bottom.
       distance     : how far it MOVES from start by max scroll
                      (start -2 + distance 3 => ends 1 above the frame bottom).
       acceleration : finish earlier. 0 = at page bottom; 16 = at 84%; neg = 0; cap 99 = 1%.
       easeIn/easeOut : true = start / arrive gently.

     BLUR (its own timeline):
       blurStart / blurEnd : blur px at page top / at max scroll (interpolates).
       blurAcceleration    : finish the blur change earlier (same 0..99 rule).

     COLOUR / GRADE (static; applied as filters, so they respect the image's
     transparent torn edges):
       saturate / brightness / contrast : percent, 100 = unchanged.
       opacity  : percent, 100 = solid … 0 = invisible (this plane's image only).
       tint     : colorization strength, 0 = off … 100 = fully tinted (monochrome).
       tintHue  : the tint colour as a hue rotation in degrees (0 ≈ warm sepia).

     GLOBALS:
       masterHeight, masterStart, masterDistance, masterAcceleration (added to each
       plane's matching value). anchorImageX / anchorScreenX are now PER-PLANE.

<!-- ============================================================================
     ★ CONTROL PANEL  — GRID 2 ★
     Section 2 = the ported GRID-2 system (from grid2_lab). NO LONGER a CSS grid of
     cells: it is a section-switching viewer. Desktop (_h): side menu + buffer/gap/
     core switching panels + switch indicators + custom scrollbar. Mobile (_v): all
     cores stacked with gaps + hamburger popup. The GRID 2 CONTROLLER (script near the
     end of <body>) reads these params and builds the DOM from the CORE <template>s in .s2.
     SCOPE (from the parameters worksheet): shared params carry _h/_v; desktop-only carry
     _h; mobile-only carry _v; behaviour constants are orientation-independent.
     Region sizes are numbers = % of --appvh (heights / y-anchors) or % of viewport width
     (widths / x-anchors); the controller computes them to px. Some values stay as raw CSS
     lengths (clamp()/inset shorthand) and pass straight through.
     ============================================================================ -->
<script>
  window.GRID2 = {

    // ===== CONTAINER SIZE (% of one screen) — sizes the .s2 box =====
    sectionWidth_h: 100,
    sectionWidth_v: 100,
    sectionHeight_h: 100,
    sectionHeight_v: 100,

    // ===== REGION HEIGHTS (switch geometry) — % of --appvh =====
    gapBefore_h: 16.667,    /* GAP-BEFORE: breathing room above CORE = default rest inset (100/6) */
    gapBefore_v: 16.667,
    gapAfter_h: 16.667,     /* GAP-AFTER: breathing room below CORE (100/6) */
    gapAfter_v: 16.667,
    bufferBefore_h: 33.333, /* BUFFER-BEFORE (desktop): up-runway; reach its top = previous section (100/3) */
    bufferAfter_h: 50,      /* BUFFER-AFTER (desktop): down-runway; reach its bottom = next section (100/2) */
    minHeightCustom_h: 0,   /* CORE min-height override (% of --appvh); 0 = default = 100 - gapBefore - gapAfter */

    // ===== SWITCH INDICATOR (desktop) =====
    indBarWidth_h: 'clamp(120px, 16dvw, 240px)',  /* indicator bar width (raw CSS length) */

    // ===== DESKTOP ANCHORS — top-centre model: left = ax - w/2 ; top = ay =====
    // w & ax = % of viewport width ; h & ay = % of --appvh. Desktop-only (_h).
    menu:      { w_h: 16.667, h_h: 40,  ax_h: 25,    ay_h: 16.667 },
    viewport:  { w_h: 40,     h_h: 100, ax_h: 68.75, ay_h: 0 },
    scrollbar: { w_h: 'clamp(3px, 0.35dvw, 6px)', h_h: 40, ax_h: 93.75, ay_h: 16.667 },

    // ===== MENU ITEM STYLING (shared) — raw CSS values =====
    miFontSize_h: '1.5rem',  miFontSize_v: '1.5rem',
    miLineHeight_h: '1.1em', miLineHeight_v: '1.1em',
    miAlign_h: 'right',      miAlign_v: 'right',
    miPadY_h: '0px',         miPadY_v: '0px',
    miPadX_h: '0px',         miPadX_v: '0px',

    // ===== MOBILE STACK (mobile-only, _v) =====
    gapMobile_v: 16.667,       /* between cores, % of --appvh */
    gapMobileFirst_v: 16.667,  /* before first core */
    gapMobileLast_v: 16.667,   /* after last core */
    mPadX_v: 12.5,             /* stack left/right padding, % of viewport width (100/8) */
    mPopupInset_v: '33dvh calc(100dvw/16) calc(100dvw/16) 33dvw',  /* popup inset: top right bottom left (raw) */

    // ===== COLOURS (placeholders — swapped for brand kit in the content/brand stage) =====
    menuBg_h: '#29d6d6',       menuBg_v: '#29d6d6',       /* menu + popup fill */
    panelBg_h: '#f5f5f5',      panelBg_v: '#f5f5f5',      /* content viewport bg */
    scrollbarColor_h: '#e11d1d', scrollbarColor_v: '#e11d1d',

  <!-- ============ ENGINE (reads the control-panel sections above) ============ -->
  <script>
    (function(){
      var LAYERS   = window.LAYERS   || {};
      var PARALLAX = window.PARALLAX || {};
      var GENERAL  = window.GENERAL  || {};
      var GRID1    = window.GRID1    || {};

      // ---- STABLE viewport size: frozen so the mobile URL bar (which changes
      //      innerHeight on scroll) can't reflow the layout. Updated only on a
      //      real width / orientation change. ----
      var APPW = window.innerWidth, APPH = window.innerHeight;
      function setVH(){ APPW = window.innerWidth; APPH = window.innerHeight;
                        document.documentElement.style.setProperty('--appvh', APPH + 'px'); }
      setVH();

      function el(name){ return document.querySelector('[data-layer="' + name + '"]'); }
      // square counts as vertical (height >= width)
      function vertical(){ return window.innerHeight >= window.innerWidth; }
      // read the orientation-active variant of a base parameter
      function pick(obj, base){ if(!obj) return undefined; return obj[base + (vertical() ? '_v' : '_h')]; }

      function ease(p,i,o){ if(i&&o) return p*p*(3-2*p); if(i) return p*p; if(o) return 1-(1-p)*(1-p); return p; }

      var planes = Object.keys(PARALLAX)
        .filter(function(k){ return /^(parallax_|sky_)/.test(k); })
        .map(function(k){ var f = el(k); return { cfg:PARALLAX[k], frame:f, img: f ? f.querySelector('img') : null }; });

      // ---- LAYOUT: orientation-dependent, NOT scroll-dependent ----
      //      z-index + visibility (all layers), section BG colour, parallax image size
      function layout(){
        var vh = APPH;
        var NAMES_PX = 0;

        Object.keys(LAYERS).forEach(function(name){
          var node = el(name); if(!node) return;
          var z = pick(LAYERS[name], 'zIndex');     if(z != null) node.style.zIndex  = z;
          var v = pick(LAYERS[name], 'visibility'); if(v != null) node.style.opacity = v / 100;
        });


        var mH   = pick(PARALLAX, 'masterHeight') || 0;
        var fill = !!pick(GENERAL, 'fillParallaxGaps');       // GENERAL CONTROLS toggle
        var cap  = !!pick(GENERAL, 'maxParallaxHeight100');   // GENERAL CONTROLS toggle
        var vw   = APPW;
        planes.forEach(function(p){
          if(!p.img) return;
          var aImg = pick(p.cfg, 'anchorImageX');  if(aImg == null) aImg = 50;
          var aScr = pick(p.cfg, 'anchorScreenX'); if(aScr == null) aScr = 50;
          var hPct = mH + (pick(p.cfg, 'heightAlt') || 0);   // % of screen height
          // FILL THE GAPS: raise height so the image width reaches the sides.
          // imgAspect read LIVE from the actual image (needs it loaded).
          if(fill && p.img.naturalWidth && p.img.naturalHeight){
            var minPct = 100 * (vw / vh) / (p.img.naturalWidth / p.img.naturalHeight);
            if(hPct < minPct) hPct = minPct;
          }
          if(cap && hPct > 100) hPct = 100;                  // never taller than the screen
          p.img.style.height    = (hPct / 100 * vh).toFixed(1) + 'px';
          p.img.style.width     = 'auto';
          p.img.style.left      = aScr + '%';                   // horizontal anchor: screen point
          p.img.style.transform = 'translateX(-' + aImg + '%)'; // horizontal anchor: image point

          // ---- COLOUR / GRADE (static, alpha-safe filters) ----
          var g = function(k, d){ var v = pick(p.cfg, k); return v == null ? d : v; };
          p.grade = 'saturate(' + g('saturate',100) + '%) brightness(' + g('brightness',100)
                  + '%) contrast(' + g('contrast',100) + '%) opacity(' + g('opacity',100)
                  + '%) sepia(' + g('tint',0) + '%) hue-rotate(' + g('tintHue',0) + 'deg)';
        });

        // ---- GRID 1 (Section 1): one grid, five cells, all from GRID 1 CONTROLS ----
        var hero = document.querySelector('.s1');
        if(hero){
          hero.style.width  = ((pick(GRID1,'sectionWidth')  || 100) / 100 * document.documentElement.clientWidth).toFixed(1) + 'px';
          hero.style.height = ((pick(GRID1,'sectionHeight') || 100) / 100 * APPH).toFixed(1) + 'px';
          // GRID 1: container track skeleton
          var gCols = pick(GRID1,'columns'); if(gCols != null) hero.style.gridTemplateColumns = gCols;
          var gRows = pick(GRID1,'rows');    if(gRows != null) hero.style.gridTemplateRows    = gRows;
          hero.style.gap = ((pick(GRID1,'gap') || 0)) + 'px';
          var aV = function(v){ return v === 't' ? 'start' : (v === 'b' ? 'end' : 'center'); };
          var aH = function(h){ return h === 'l' ? 'start' : (h === 'r' ? 'end' : 'center'); };
          var ITEMS = GRID1.items || {};
          Object.keys(ITEMS).forEach(function(nm){
            var cell = document.querySelector('.cell[data-cell="' + nm + '"]'); if(!cell) return;
            var it = ITEMS[nm];
            cell.style.gridColumn = (pick(it,'colStart') || 1) + ' / span ' + (pick(it,'colSpan') || 1);
            cell.style.gridRow    = (pick(it,'rowStart') || 1) + ' / span ' + (pick(it,'rowSpan') || 1);
            var a = String(pick(it,'align') || 'cc').toLowerCase();
            cell.style.alignItems   = aV(a.charAt(0));
            cell.style.justifyItems = aH(a.charAt(1));
            cell.style.paddingTop    = ((pick(it,'padT') || 0) / 100 * vh).toFixed(1) + 'px';
            cell.style.paddingBottom = ((pick(it,'padB') || 0) / 100 * vh).toFixed(1) + 'px';
            cell.style.paddingLeft   = ((pick(it,'padL') || 0) / 100 * vh).toFixed(1) + 'px';
            cell.style.paddingRight  = ((pick(it,'padR') || 0) / 100 * vh).toFixed(1) + 'px';
            var z = pick(it,'zIndex');     if(z != null) cell.style.zIndex  = z;
            var v = pick(it,'visibility'); if(v != null) cell.style.opacity = v / 100;
            var bg = pick(it,'bg');        if(bg != null) cell.style.background = bg;
          });


          // ---- TEXT ELEMENTS: sizes cascade from the & inside P+F ----
          var T = window.TEXT || {};
          var tv = function(el, k){ return pick(T[el] || {}, k); };
          var ampEl = hero.querySelector('.amp');
          var ampRatio = (tv('text_pf_amp','size') == null ? 66 : tv('text_pf_amp','size')) / 100;
          if(ampEl) ampEl.style.fontSize = ampRatio + 'em';   // & = % of names (set before fitting)

          var names = hero.querySelector('.names');
          var namesPx = 0, ampPx = 0;
          if(names){
            var pfBox = hero.querySelector('.cell[data-cell="pf"]');
            names.style.fontSize = '100px';
            var h0 = names.offsetHeight || 1, w0 = names.offsetWidth || 1;
            var availH = h0, availW = w0;
            if(pfBox){
              var cs = getComputedStyle(pfBox);
              availH = pfBox.clientHeight - (parseFloat(cs.paddingTop)  || 0) - (parseFloat(cs.paddingBottom) || 0);
              availW = pfBox.clientWidth  - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight)  || 0);
            }
            var scale = Math.min(availH / h0, availW / w0);
            if(!(scale > 0)) scale = availH / h0;
            var nSize = (tv('text_pf_names','size') == null ? 100 : tv('text_pf_names','size')) / 100;
            namesPx = 100 * scale * nSize; NAMES_PX = namesPx;
            names.style.fontSize = namesPx.toFixed(2) + 'px';
            ampPx = namesPx * ampRatio;
          }
          var setSize = function(sel, el, def){ var n = hero.querySelector(sel); if(!n) return;
            var sv = tv(el,'size'); n.style.fontSize = ((sv == null ? def : sv) / 100 * namesPx).toFixed(2) + 'px'; };
          setSize('.hero-date','text_date',33);
          setSize('.hero-location','text_location',33);
          setSize('.qbtn','text_buttonQ',50);
          setSize('.qnote','text_buttonQnote',12);

          var styleText = function(sel, el){
            var nodes = hero.querySelectorAll(sel);
            for(var i=0;i<nodes.length;i++){
              var n = nodes[i];

              var ff = tv(el,'font');  if(ff != null) n.style.fontFamily = ff;
              var c = tv(el,'case');   if(c != null) n.style.textTransform = c;
              var sh = tv(el,'shift');
              if(sh != null){ n.style.position = 'relative'; n.style.top = sh + 'em'; }
            }
          };
          styleText('.name','text_pf_names'); styleText('.amp','text_pf_amp');
          styleText('.hero-date','text_date'); styleText('.hero-location','text_location');
          styleText('.qbtn','text_buttonQ'); styleText('.qnote','text_buttonQnote');

        }

        // ---- GRID 2 (Section 2): one grid, one placeholder cell ----
        var G2 = window.GRID2 || {};
        var g2el = document.querySelector('.s2');
        if(g2el){
          g2el.style.width  = ((pick(G2,'sectionWidth')  || 100) / 100 * document.documentElement.clientWidth).toFixed(1) + 'px';
          g2el.style.height = ((pick(G2,'sectionHeight') || 100) / 100 * APPH).toFixed(1) + 'px';
          var g2c = pick(G2,'columns'); if(g2c != null) g2el.style.gridTemplateColumns = g2c;
          var g2r = pick(G2,'rows');    if(g2r != null) g2el.style.gridTemplateRows    = g2r;
          g2el.style.gap = ((pick(G2,'gap') || 0)) + 'px';
          var g2V = function(v){ return v === 't' ? 'start' : (v === 'b' ? 'end' : 'center'); };
          var g2H = function(h){ return h === 'l' ? 'start' : (h === 'r' ? 'end' : 'center'); };
          var G2I = G2.items || {};
          Object.keys(G2I).forEach(function(nm){
            var cell = g2el.querySelector('.cell[data-cell="' + nm + '"]'); if(!cell) return;
            var it = G2I[nm];
            cell.style.gridColumn = (pick(it,'colStart') || 1) + ' / span ' + (pick(it,'colSpan') || 1);
            cell.style.gridRow    = (pick(it,'rowStart') || 1) + ' / span ' + (pick(it,'rowSpan') || 1);
            var a = String(pick(it,'align') || 'cc').toLowerCase();
            cell.style.alignItems   = g2V(a.charAt(0));
            cell.style.justifyItems = g2H(a.charAt(1));
            cell.style.paddingTop    = ((pick(it,'padT') || 0) / 100 * vh).toFixed(1) + 'px';
            cell.style.paddingBottom = ((pick(it,'padB') || 0) / 100 * vh).toFixed(1) + 'px';
            cell.style.paddingLeft   = ((pick(it,'padL') || 0) / 100 * vh).toFixed(1) + 'px';
            cell.style.paddingRight  = ((pick(it,'padR') || 0) / 100 * vh).toFixed(1) + 'px';
            var z = pick(it,'zIndex');     if(z != null) cell.style.zIndex  = z;
            var vv = pick(it,'visibility'); if(vv != null) cell.style.opacity = vv / 100;
            var bg = pick(it,'bg');        if(bg != null) cell.style.background = bg;
          });
        }
        // GRID 2 placeholder copy — styled by the text_buttonQnote TEXT entry
        var s2n = document.querySelector('.s2note');
        if(s2n){
          var T2 = window.TEXT || {};
          var q2 = function(k){ return pick(T2['text_buttonQnote'] || {}, k); };
          var sz2 = q2('size'); if(sz2 == null) sz2 = 12;
          s2n.style.fontSize = (sz2 / 100 * NAMES_PX).toFixed(2) + 'px';
          var w2 = q2('weight'); if(w2 != null) s2n.style.fontWeight = w2;
          var f2 = q2('font');   if(f2 != null) s2n.style.fontFamily = f2;
          var c2 = q2('case');   if(c2 != null) s2n.style.textTransform = c2;
        }

        // ---- BUTTON (.qbtn) + LINK styling (CSS vars) ----
        var UI = window.BUTTONLINK || {};
        var _rs = document.documentElement.style;
        var _qb = UI.button || {};
        _rs.setProperty('--qbtn-bg',      pick(_qb,'bg')             || '#FFFFFF');
        _rs.setProperty('--qbtn-bg-h',    pick(_qb,'bgHover')        || '#F0F0F0');
        _rs.setProperty('--qbtn-color',   pick(_qb,'textColor')      || '#1F1F1F');
        _rs.setProperty('--qbtn-color-h', pick(_qb,'textColorHover') || '#1F1F1F');
        _rs.setProperty('--qbtn-bw',      ((pick(_qb,'borderWidth')  || 0)) + 'px');
        _rs.setProperty('--qbtn-bc',      pick(_qb,'borderColor')    || '#1F1F1F');
        _rs.setProperty('--qbtn-radius',  ((pick(_qb,'borderRadius') || 0)) + 'px');
        var _py = pick(_qb,'padY'); if(_py == null){ _py = 0.6; }
        var _px = pick(_qb,'padX'); if(_px == null){ _px = 1.2; }
        _rs.setProperty('--qbtn-pad',     _py + 'em ' + _px + 'em');
        var _lk = UI.link || {};
        _rs.setProperty('--link-color', pick(_lk,'color')      || 'inherit');
        _rs.setProperty('--link-hover', pick(_lk,'hoverColor') || 'inherit');
        var _dot = !!pick(_lk,'dotted');
        var _links = document.querySelectorAll('a.pf-link');
        for(var _l=0; _l<_links.length; _l++){
          var _a = _links[_l];
          if(_dot){
            _a.style.textDecorationLine      = 'underline';
            _a.style.textDecorationStyle     = 'dotted';
            _a.style.textDecorationColor     = pick(_lk,'underlineColor') || 'currentColor';
            _a.style.textDecorationThickness = ((pick(_lk,'underlineThickness') || 1)) + 'px';
          } else { _a.style.textDecorationLine = 'none'; }
        }

      }

      // ---- APPLY: scroll-driven motion + blur ----
      var ticking = false;
      function apply(){
        var vh = APPH;
        var y  = window.scrollY || window.pageYOffset || 0;
        var maxScroll = Math.max(1, document.documentElement.scrollHeight - vh);
        var mSt  = pick(PARALLAX, 'masterStart')        || 0;
        var mDi  = pick(PARALLAX, 'masterDistance')     || 0;
        var mAcc = pick(PARALLAX, 'masterAcceleration') || 0;
        var prog = Math.min(Math.max(y / maxScroll, 0), 1);   // shared raw scroll progress 0..1

        planes.forEach(function(p){
          if(!p.frame) return;
          var L = p.cfg;
          var startPos = (pick(L,'start')    || 0) + mSt;   // dvh above frame bottom @ page top
          var travel   = (pick(L,'distance') || 0) + mDi;   // how far it MOVES from start (dvh)

          var accel = (pick(L,'acceleration') || 0) + mAcc;
          if(accel < 0)  accel = 0;
          if(accel > 99) accel = 99;
          var t = Math.min(prog / ((100 - accel) / 100), 1);

          var posDvh = startPos + travel * ease(t, !!pick(L,'easeIn'), !!pick(L,'easeOut'));
          p.frame.style.transform = 'translateY(' + (-(posDvh / 100) * vh).toFixed(2) + 'px)';

          // blur: blurStart -> blurEnd on its OWN acceleration
          var bAcc = (pick(L,'blurAcceleration') || 0);
          if(bAcc < 0)  bAcc = 0;
          if(bAcc > 99) bAcc = 99;
          var bt = Math.min(prog / ((100 - bAcc) / 100), 1);
          var b0 = pick(L,'blurStart') || 0, b1 = pick(L,'blurEnd') || 0;
          if(p.img) p.img.style.filter = 'blur(' + (b0 + (b1 - b0) * bt).toFixed(2) + 'px) ' + (p.grade || '');
        });
        ticking = false;
      }
      function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(apply); } }

      window.addEventListener('scroll', onScroll, {passive:true});
      window.addEventListener('resize', function(){
        var flip = (window.innerHeight >= window.innerWidth) !== (APPH >= APPW);
        if(window.innerWidth !== APPW || flip){ setVH(); layout(); }   // genuine layout change only
        onScroll();
      }, {passive:true});
      window.addEventListener('orientationchange', function(){ setVH(); layout(); onScroll(); });

      // images may not be measured yet on first paint; re-run layout when each loads
      planes.forEach(function(p){ if(p.img && !p.img.complete) p.img.addEventListener('load', layout); });
      layout();
      apply();
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(layout); }

      // ---- theme toggle (default light; remembers choice) ----
      var root = document.documentElement;
      var scr = document.querySelector('.hero-scroll');
      if(scr){ scr.addEventListener('click', function(){
        // GRID 1 arrow → scroll to 100% + lock into GRID 2 (desktop only, §6.2).
        if(!vertical() && window.GRID2ENGINE && window.GRID2ENGINE.lockToBottom){ window.GRID2ENGINE.lockToBottom(); return; }
        window.scrollBy({ top: (window.innerHeight || document.documentElement.clientHeight), left: 0, behavior: 'smooth' });
      }); }
      var btn  = document.querySelector('.theme-toggle');
      if(btn){
        btn.addEventListener('click', function(){
          var next = (root.getAttribute('data-theme') === 'light') ? 'dark' : 'light';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('pf-theme', next); } catch(e){}
        });
      }
    })();

  <!-- ============ GRID 2 CONTROLLER (ported from grid2_lab.html, g2- namespaced) ============
       Desktop (_h): section-switching viewer (menu + buffer/gap/core panels + indicators + scrollbar).
       Mobile (_v): stacked cores + hamburger popup (PROVISIONAL lab-style; the "one continuous scroll"
       mobile integration is a later stage). Mode is driven by the site's orientation test
       (innerHeight >= innerWidth) and rebuilt on a genuine resize/rotate. GRID 1<->2 lock glue (§6):
       the switch engine + wheel-capture are active ONLY in locked mode. All tuning is in window.GRID2. -->
  <script>
  (function(){
    var G2  = window.GRID2 || {};
    var BEH = G2.behavior || {};
    var clamp = function(v,a,b){ return Math.min(Math.max(v,a),b); };
    function vertical(){ return window.innerHeight >= window.innerWidth; }
    function pick(obj, base){ if(!obj) return undefined; return obj[base + (vertical() ? '_v' : '_h')]; }
    function appH(){ var v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--appvh')); return (v>0)?v:window.innerHeight; }
    function appW(){ return document.documentElement.clientWidth; }
    function isNum(v){ return typeof v === 'number'; }
    function pxH(pct){ return (pct/100*appH()).toFixed(1)+'px'; }   // % of --appvh
    function pxW(pct){ return (pct/100*appW()).toFixed(1)+'px'; }   // % of viewport width

    var s2       = document.querySelector('.s2');
    var deskRoot = document.getElementById('g2DesktopRoot');
    var mobRoot  = document.getElementById('g2MobileRoot');
    if(!s2 || !deskRoot || !mobRoot) return;

    // ---- CORE sources (Option A): read the <template> blocks once ----
    var SECTIONS = Array.prototype.map.call(s2.querySelectorAll('template.g2-core-src'), function(t){
      return { id: t.getAttribute('data-section'),
               label: t.getAttribute('data-label') || t.getAttribute('data-section'),
               html: t.innerHTML };
    });

    // ---- shared: push GRID2 params into CSS vars (computed vs --appvh) ----
    function setVars(){
      var st = s2.style;
      var gb=pick(G2,'gapBefore'), ga=pick(G2,'gapAfter'), bb=pick(G2,'bufferBefore'), ba=pick(G2,'bufferAfter');
      if(gb!=null) st.setProperty('--g2-gap-before', pxH(gb));
      if(ga!=null) st.setProperty('--g2-gap-after',  pxH(ga));
      if(bb!=null) st.setProperty('--g2-buffer-before', pxH(bb));
      if(ba!=null) st.setProperty('--g2-buffer-after',  pxH(ba));
      var mc = pick(G2,'minHeightCustom');
      var minPct = (mc && mc>0) ? mc : (100 - (gb||0) - (ga||0));
      st.setProperty('--g2-min-height', pxH(minPct));
      var ibw = pick(G2,'indBarWidth'); if(ibw!=null) st.setProperty('--g2-ind-bar-width', ibw);
      [['miFontSize','--g2-mi-font-size'],['miLineHeight','--g2-mi-line-height'],['miAlign','--g2-mi-align'],['miPadY','--g2-mi-pad-y'],['miPadX','--g2-mi-pad-x']]
        .forEach(function(p){ var v=pick(G2,p[0]); if(v!=null) st.setProperty(p[1], v); });
      [['menuBg','--g2-menu-bg'],['panelBg','--g2-panel-bg'],['scrollbarColor','--g2-scrollbar'],['ink','--g2-ink']]
        .forEach(function(p){ var v=pick(G2,p[0]); if(v!=null) st.setProperty(p[1], v); });
      var gm=pick(G2,'gapMobile'), gmf=pick(G2,'gapMobileFirst'), gml=pick(G2,'gapMobileLast'), mpx=pick(G2,'mPadX'), mpi=pick(G2,'mPopupInset');
      if(gm!=null)  st.setProperty('--g2-gap-mobile', pxH(gm));
      if(gmf!=null) st.setProperty('--g2-gap-mobile-first', pxH(gmf));
      if(gml!=null) st.setProperty('--g2-gap-mobile-last', pxH(gml));
      if(mpx!=null) st.setProperty('--g2-m-pad-x', pxW(mpx));
      if(mpi!=null) st.setProperty('--g2-m-popup-inset', mpi);
    }
    function anchorEl(el, cfg){
      if(!el || !cfg) return;
      var w=pick(cfg,'w'), h=pick(cfg,'h'), ax=pick(cfg,'ax'), ay=pick(cfg,'ay');
      if(w!=null)  el.style.setProperty('--g2-w',  isNum(w)?pxW(w):w);
      if(h!=null)  el.style.setProperty('--g2-h',  isNum(h)?pxH(h):h);

    function setAnchors(){
      anchorEl(document.getElementById('g2Menu'), G2.menu);
      anchorEl(document.getElementById('g2Viewport'), G2.viewport);

    function maxScroll(){ return Math.max(0, document.documentElement.scrollHeight - appH()); }

    /* ============================================================
       DESKTOP ENGINE ( _h )
       ============================================================ */

        indBeforeBarFinish:(BEH.indBeforeBarFinish!=null?BEH.indBeforeBarFinish:0.80),
        indAfterTextFinish:(BEH.indAfterTextFinish!=null?BEH.indAfterTextFinish:0.80),
        indAfterBarFinish:(BEH.indAfterBarFinish!=null?BEH.indAfterBarFinish:0.80),
        copyBack:(BEH.copyBackGeneric||''), copyNext:(BEH.copyNextGeneric||''), labelTop:(BEH.labelTop||'')
      };

      menu.innerHTML=''; frame.innerHTML='';
      var items=[],panels=[],info=[],savedScroll=[],active=0,metricsActive=null,settling=false,settleTimer=null;

      setAnchors();

      // Úvod — menu-only exit control (no panel); the exception to lock-trigger #3
      var uvod=document.createElement('button'); uvod.type='button'; uvod.className='g2-menu-item g2-uvod';
      uvod.textContent=(BEH.uvodLabel||'Úvod');
      uvod.addEventListener('click', function(){ unlockToTop(); }, sig);
      menu.appendChild(uvod);

      SECTIONS.forEach(function(s,i){
        var last=(i===SECTIONS.length-1);
        var btn=document.createElement('button'); btn.type='button'; btn.className='g2-menu-item'; btn.textContent=s.label;
        btn.addEventListener('click', function(){ if(!locked) lockToBottom(); activate(i,false); }, sig);
        menu.appendChild(btn); items.push(btn);

        var nameBefore=(i>0)?SECTIONS[i-1].label:'', nameAfter=(!last)?SECTIONS[i+1].label:'';
        var backLabel=(i>0)?(CONFIG.copyBack+nameBefore):CONFIG.labelTop;
        var nextLabel=(!last)?(CONFIG.copyNext+nameAfter):'';
        var ind=function(cls,label){ return '<div class="g2-switch-indicator '+cls+'"><span class="g2-si-label">'+label+'</span><span class="g2-si-bar"><i></i></span></div>'; };

        var panel=document.createElement('section'); panel.className='g2-panel'; panel.id='g2panel-'+s.id;
        panel.innerHTML='<div class="g2-content">'+
          '<div class="g2-buffer g2-buffer-before">'+ind('g2-ind-back',backLabel)+'</div>'+
          '<div class="g2-gap g2-gap-before"></div>'+
          '<div class="g2-core"></div>'+
          '<div class="g2-gap g2-gap-after"></div>'+
          (last?'':'<div class="g2-buffer g2-buffer-after">'+ind('g2-ind-next',nextLabel)+'</div>')+
        '</div>';
        frame.appendChild(panel); panels.push(panel);
        info.push({ indBack:panel.querySelector('.g2-ind-back'), indNext:panel.querySelector('.g2-ind-next') });
        savedScroll.push(null);
        panel.addEventListener('scroll', function(){ if(i===active) onScroll(); }, {passive:true, signal:ac.signal});
      });

      function measure(sel){ var e=panels[active].querySelector(sel); return e?e.offsetHeight:0; }
      function computeMetrics(){ metricsActive={ bufferBefore:measure('.g2-buffer-before'), gapBefore:measure('.g2-gap-before'),
        core:measure('.g2-core'), gapAfter:measure('.g2-gap-after'), bufferAfter:measure('.g2-buffer-after') }; }
      function setAnim(indEl,p,tf,bf){ if(!indEl) return; indEl.classList.toggle('show',p>0);
        indEl.querySelector('.g2-si-label').style.opacity=clamp(p/tf,0,1);
        indEl.querySelector('.g2-si-bar > i').style.transform='scaleX('+clamp(p/bf,0,1)+')'; }
      function updateIndicators(){ var vp=panels[active],m=metricsActive,max=vp.scrollHeight-vp.clientHeight,it=info[active];
        if(it.indBack && m.bufferBefore>0) setAnim(it.indBack, clamp((m.bufferBefore-vp.scrollTop)/m.bufferBefore,0,1), CONFIG.indBeforeTextFinish, CONFIG.indBeforeBarFinish);
        if(it.indNext && m.bufferAfter>0) setAnim(it.indNext, clamp((vp.scrollTop-(max-m.bufferAfter))/m.bufferAfter,0,1), CONFIG.indAfterTextFinish, CONFIG.indAfterBarFinish); }
      function readingRange(){ var vp=panels[active],m=metricsActive,max=vp.scrollHeight-vp.clientHeight;
        return { top:m.bufferBefore, bot:Math.max(m.bufferBefore,max-m.bufferAfter), reading:(m.gapBefore+m.core+m.gapAfter) }; }
      function updateThumb(){ var vp=panels[active],r=readingRange();
        var ratio=Math.min(1, vp.clientHeight/Math.max(1,r.reading));
        var th=Math.max(24, Math.round(track.clientHeight*ratio)); thumb.style.height=th+'px';
        var span=Math.max(1,r.bot-r.top), p=clamp((vp.scrollTop-r.top)/span,0,1);
        thumb.style.top=(p*(track.clientHeight-th)).toFixed(1)+'px'; }
      function onScroll(){ if(settling) return; var vp=panels[active],m=metricsActive,max=vp.scrollHeight-vp.clientHeight;
        updateIndicators(); updateThumb();
        if(m.bufferAfter>0 && active<panels.length-1 && vp.scrollTop>=max-CONFIG.edgeEps) activate(active+1,true);
        else if(active>0 && vp.scrollTop<=CONFIG.edgeEps) activate(active-1,true); }
      function activate(i,reset){ var prev=active;
        if(panels[prev]&&panels[prev].classList.contains('active')) savedScroll[prev]=reset?null:panels[prev].scrollTop;
        active=i;
        items.forEach(function(b,j){ b.classList.toggle('active',j===i); });
        panels.forEach(function(p,j){ p.classList.toggle('active',j===i); });
        computeMetrics();
        var def=metricsActive.bufferBefore, max=Math.max(0,panels[i].scrollHeight-panels[i].clientHeight);
        var want=(reset||savedScroll[i]==null)?def:savedScroll[i];
        panels[i].scrollTop=clamp(want,0,max); savedScroll[i]=panels[i].scrollTop;
        updateIndicators(); updateThumb();
        settling=true; panels[i].classList.add('settling'); clearTimeout(settleTimer);
        settleTimer=setTimeout(function(){ settling=false; panels[i].classList.remove('settling'); }, CONFIG.cooldownMs); }
      function goToDefault(){ activate(active,true); }

      // custom scrollbar (only usable while locked)
      var dragging=false,startPtrY=0,startTop=0;
      function scrollFromThumb(topPx){ var vp=panels[active],r=readingRange(),travel=track.clientHeight-thumb.clientHeight;
        var p=travel>0?clamp(topPx,0,travel)/travel:0; vp.scrollTop=r.top+p*(r.bot-r.top); }
      thumb.addEventListener('pointerdown', function(e){ if(!locked) return; e.preventDefault(); dragging=true; thumb.classList.add('dragging'); thumb.setPointerCapture(e.pointerId); startPtrY=e.clientY; startTop=parseFloat(thumb.style.top)||0; }, sig);
      thumb.addEventListener('pointermove', function(e){ if(dragging) scrollFromThumb(startTop+(e.clientY-startPtrY)); }, sig);
      thumb.addEventListener('pointerup', function(){ dragging=false; thumb.classList.remove('dragging'); }, sig);
      thumb.addEventListener('pointercancel', function(){ dragging=false; thumb.classList.remove('dragging'); }, sig);
      track.addEventListener('pointerdown', function(e){ if(!locked || e.target===thumb) return; var rect=track.getBoundingClientRect(); scrollFromThumb((e.clientY-rect.top)-thumb.clientHeight/2); }, sig);

      // wheel — active ONLY while locked
      window.addEventListener('wheel', function(e){
        if(!locked || dragging) return;
        var vp=panels[active];
        if(active===0 && e.deltaY<0 && vp.scrollTop<=CONFIG.edgeEps){ e.preventDefault(); unlockToTop(); return; }  // exit up through section-0 before-buffer
        if(settling){ e.preventDefault(); return; }
        if(vp.contains(e.target)) return;               // native panel scroll (overscroll-behavior:contain keeps the page pinned)
        e.preventDefault();
        var f=e.deltaMode===1?16:(e.deltaMode===2?vp.clientHeight:1);
        vp.scrollTop+=e.deltaY*f;
      }, {passive:false, signal:ac.signal});

      // page-mode → auto-lock at 100%; while locked → re-pin to the bottom
      window.addEventListener('scroll', function(){
        if(locked){ var mx=maxScroll(); if(Math.abs(window.scrollY-mx)>2) window.scrollTo(0,mx); return; }
        if(window.scrollY >= maxScroll()-CONFIG.edgeEps) lockToBottom();
      }, {passive:true, signal:ac.signal});

      function relayout(){ setAnchors(); computeMetrics(); updateIndicators(); updateThumb(); }

      // lock / unlock (desktop only) — assigned to the outer refs, exposed via the arrow + API
      lockToBottom = function(){
        if(vertical() || !built || built.mode!=='h') return;
        window.scrollTo(0, maxScroll());
        locked=true; document.body.classList.add('g2-locked');
        activate(active,true);                       // land the active section at its default
      };
      unlockToTop = function(){
        locked=false; document.body.classList.remove('g2-locked');
        window.scrollTo(0,0);                          // insta-jump to the very top of GRID 1 (§6)
      };

      // initial fill — page mode, dormant
      activate(0,false);
      SECTIONS.forEach(function(s,i){ panels[i].querySelector('.g2-core').innerHTML=s.html; });
      computeMetrics(); updateIndicators(); updateThumb();

      return { mode:'h', relayout:relayout, goToDefault:goToDefault,
        goToSection:function(i){ if(!locked) lockToBottom(); activate(i,false); },
        destroy:function(){ ac.abort(); clearTimeout(settleTimer); menu.innerHTML=''; frame.innerHTML=''; document.body.classList.remove('g2-locked'); } };
    }

    /* ============================================================
       MOBILE ENGINE ( _v )  — provisional lab-style stack (no lock)
       ============================================================ */
    function buildMobile(){
      var ac=new AbortController(), sig={signal:ac.signal};
      var mv=document.getElementById('g2MViewport'), ham=document.getElementById('g2MHamburger'), pop=document.getElementById('g2MPopup');
      var html='<div class="g2-gap-mobile-first"></div>';
      SECTIONS.forEach(function(s,i){
        html+='<div class="g2-m-core" id="g2mcore-'+s.id+'">'+s.html+'</div>';
        if(i<SECTIONS.length-1) html+='<div class="g2-gap-mobile"></div>';
      });
      html+='<div class="g2-gap-mobile-last"></div>';
      mv.innerHTML=html;
      pop.innerHTML=SECTIONS.map(function(s){ return '<button type="button" class="g2-menu-item" data-target="g2mcore-'+s.id+'">'+s.label+'</button>'; }).join('');
      pop.hidden=true;
      ham.addEventListener('click', function(){ pop.hidden=!pop.hidden; }, sig);
      pop.addEventListener('click', function(e){ var b=e.target.closest('.g2-menu-item'); if(!b) return;
        var t=document.getElementById(b.getAttribute('data-target')); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); pop.hidden=true; }, sig);
      return { mode:'v', relayout:function(){}, destroy:function(){ ac.abort(); mv.innerHTML=''; pop.innerHTML=''; pop.hidden=true; } };
    }

    /* ============================================================
       MODE CONTROLLER — orientation via the site's vertical(), rebuilt on genuine change
       ============================================================ */
    var wasVertical = vertical();
    function setMode(){
      var m = vertical() ? 'v' : 'h';
      if(built && built.mode===m){ setVars(); built.relayout(); return; }
      if(built) built.destroy();
      locked=false; document.body.classList.remove('g2-locked');
      deskRoot.style.display = (m==='h') ? 'block' : 'none';
      mobRoot.style.display  = (m==='v') ? 'block' : 'none';
      setVars();
      built = (m==='v') ? buildMobile() : buildDesktop();
    }

    window.GRID2ENGINE = {
      lockToBottom: function(){ lockToBottom(); },
      unlockToTop:  function(){ unlockToTop(); },
      isLocked:     function(){ return locked; },
      goToSection:  function(i){ if(built && built.goToSection) built.goToSection(i); }
    };

    function onResize(){
      var nowV = vertical(), flip = (nowV !== wasVertical); wasVertical = nowV;
      if(flip) setMode();
      else { setVars(); if(built) built.relayout(); }
    }
    window.addEventListener('resize', onResize, {passive:true});
    window.addEventListener('orientationchange', onResize);

    setMode();
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ setVars(); if(built) built.relayout(); }); }
  })();
  </script>
</body>
</html>

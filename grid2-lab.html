<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GRID 2 — layout lab</title>

<style>
/* ============================================================================
   GRID 2 LAB — Section-2 content layout + region-based section switching.
   NOT wired to the site engine. Units: dvw / dvh (dynamic viewport).

   Each section's CONTENT is one native-scrolling stack:
     BUFFER-BEFORE · GAP-BEFORE · CORE · GAP-AFTER · BUFFER-AFTER
   Rest position: GAP-BEFORE's top at the screen top (BUFFER-BEFORE parked above),
   so CORE starts --gap-before below the top edge.
   Scroll DOWN to the bottom of BUFFER-AFTER  -> next section.
   Scroll UP   to the top   of BUFFER-BEFORE  -> previous section.
   The switch indicators live at the inner edge of each buffer; their text opacity
   and bar grow as you scroll through the buffer, finishing at the *-finish points.

   The magenta/green/red tints are DEBUG only (to see the regions while tuning).
   ============================================================================ */

/* ============================================================================
   ★ CONTROL PANEL (CSS — layout & regions) ★  Portrait mirrors these at bottom.
   ============================================================================ */
:root{
  /* -- Region heights (the scroll runways). "1/6 dvh" = 100dvh/6, etc. -- */
  --gap-before:    calc(100dvh / 6);   /* breathing room above CORE (= default start inset) */
  --gap-after:     calc(100dvh / 6);   /* breathing room below CORE */
  --buffer-before: calc(100dvh / 3);   /* up-runway; reach its top → previous section */
  --buffer-after:  calc(100dvh / 2);   /* down-runway; reach its bottom → next section */

  /* -- Switch indicator -- */
  --ind-bar-width: clamp(120px, 16dvw, 240px);

  /* -- Lab cosmetics -- */
  --c-panel-bg: #f5f5f5;
  --c-red:      #e11d1d;
  --c-ink:      #111;
  /* debug region tints (set alpha to 0 to hide) */
  --t-buffer: rgba(255, 0, 255, .16);
  --t-gap:    rgba(0, 210, 0, .20);
  --t-core:   rgba(255, 0, 0, .10);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }

.screen{
  position:relative;
  width:100dvw; height:100dvh;
  overflow:hidden;
  background:#eef3f6;
  font-family:'Fira Sans Extra Condensed', system-ui, sans-serif;
}
.anchored{
  position:absolute;
  width:var(--w); height:var(--h);
  left:calc(var(--ax) - var(--w) / 2); top:var(--ay);
}

/* ---- 1) TURQUOISE — menu ------------------------------------------------- */
.menu{
  --w:  calc(100dvw * 1 / 6);
  --h:  calc(100dvh * 2 / 5);
  --ax: calc(100dvw * 1 / 4);
  --ay: calc(100dvh * 1 / 6);
  padding: calc(var(--w) / 5);
  background:#29d6d6;
  display:flex; flex-direction:column; justify-content:flex-start; overflow:hidden;
}
:root{ --mi-font-size:1.5rem; --mi-line-height:1.1em; --mi-align:right; --mi-pad-y:0px; --mi-pad-x:0px; }
.menu-item{
  display:block; width:100%; margin:0;
  padding: var(--mi-pad-y) var(--mi-pad-x);
  background:none; border:none; cursor:pointer;
  font-family:inherit; color:var(--c-ink);
  font-size:var(--mi-font-size); line-height:var(--mi-line-height); text-align:var(--mi-align);
}
.menu-item:hover{ text-decoration:underline; }
.menu-item.active{ font-weight:700; }

/* ---- 2) YELLOW frame — now padding/margin 0; holds the scrolling panels --- */
.viewport{
  --w:  calc(100dvw * 2 / 5);
  --h:  100dvh;
  --ax: calc(100dvw * 11 / 16);
  --ay: 0dvh;
  margin:0; padding:0;
  background:var(--c-panel-bg);
  overflow:hidden;
}
.panel{
  position:absolute; inset:0;
  margin:0; padding:0;
  overflow-y:auto; scrollbar-width:none;
  display:none;
}
.panel::-webkit-scrollbar{ display:none; }
.panel.active{ display:block; }
.panel.settling{ overflow:hidden; }        /* pin at default briefly after a switch */

.content{ width:100%; }

/* regions */
.buffer{ position:relative; width:100%; background:var(--t-buffer); }
.buffer-before{ height:var(--buffer-before); }
.buffer-after{  height:var(--buffer-after); }
.gap{ width:100%; background:var(--t-gap); }
.gap-before{ height:var(--gap-before); }
.gap-after{  height:var(--gap-after); }

.core{
  width:100%; padding:0; display:flow-root;   /* no padding; flow-root stops margin-collapse */
  background:var(--t-core);
  color:var(--c-ink); line-height:1.5; font-size:clamp(13px, 1.1dvw, 18px);
}
.core .panel-title{ margin:0 0 0.6em; font-weight:700; line-height:1.15; font-size:clamp(22px, 2.4dvw, 40px); }
.core p{ margin:0 0 1em; }
.core > *:last-child{ margin-bottom:0; }

/* switch indicator — text + bar; anchored to the inner edge of its buffer */
.switch-indicator{
  position:absolute; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:.5em;
  font:600 clamp(13px,1.2dvw,18px)/1.2 'Fira Sans Extra Condensed', system-ui, sans-serif;
  color:var(--c-ink); text-align:center; white-space:nowrap;
  opacity:0; pointer-events:none;
}
.switch-indicator.show{ opacity:1; }
.ind-back{ bottom:0; }     /* bottom-centre of BUFFER-BEFORE */
.ind-next{ top:0; }        /* top-centre of BUFFER-AFTER */
.switch-indicator .si-label{ opacity:0; }                 /* JS animates 0→1 */
.switch-indicator .si-bar{ position:relative; width:var(--ind-bar-width); height:3px;
  background:rgba(0,0,0,.2); border-radius:2px; overflow:hidden; }
.switch-indicator .si-bar > i{ position:absolute; inset:0;
  transform-origin:left center; transform:scaleX(0); background:#7a0000; }  /* JS animates 0→1 */

/* ---- 3) RED — interactive scrollbar (scoped to CORE + GAPS) --------------- */
.scrollbar{
  --w:  clamp(3px, 0.35dvw, 6px);
  --h:  calc(100dvh * 2 / 5);
  --ax: calc(100dvw * 15 / 16);
  --ay: calc(100dvh * 1 / 6);
  background:var(--c-red); border-radius:999px; cursor:pointer;
}
.scrollbar .thumb{
  position:absolute; left:50%; transform:translateX(-50%);
  width:calc(clamp(3px,0.35dvw,6px) * 2.4); height:24px; top:0;
  background:#7a0000; border-radius:999px; cursor:grab; touch-action:none;
}
.scrollbar .thumb.dragging{ cursor:grabbing; }

.lab-tag{
  position:absolute; top:10px; left:12px; z-index:10;
  font:600 12px/1 'Fira Sans Extra Condensed', system-ui, sans-serif;
  letter-spacing:.04em; color:#4a5560; opacity:.7; pointer-events:none;
}

@media (orientation: portrait){
  /* same values for now — retune the regions / menu here for portrait later */
  :root{
    --gap-before:calc(100dvh / 6); --gap-after:calc(100dvh / 6);
    --buffer-before:calc(100dvh / 3); --buffer-after:calc(100dvh / 2);
  }
  .menu{ --w:calc(100dvw*1/6); --h:calc(100dvh*2/5); --ax:calc(100dvw*1/4); --ay:calc(100dvh*1/6); }
}
</style>
</head>
<body>
  <div class="screen">
    <span class="lab-tag">GRID 2 · layout lab</span>
    <nav class="anchored menu" id="menu" aria-label="Menu"></nav>
    <div class="anchored viewport" id="viewport"></div>
    <div class="anchored scrollbar" id="scrollbar"><div class="thumb" id="thumb"></div></div>
  </div>

  <script>
  (function(){
    var SECTIONS = [
      { id:'program',   label:'Program' },
      { id:'dresscode', label:'Dress Code' },
      { id:'dary',      label:'Dary' },
      { id:'faq',       label:'Časté otázky' },
      { id:'blog',      label:'Blog' },
      { id:'kontakt',   label:'Kontakt' }
    ];
    var P = [
      'Consectetur adipiscing elit. Suspendisse porttitor egestas velit, nec gravida justo malesuada nec. Fusce non commodo leo, quis lacinia dui. In dignissim ullamcorper tellus, in dictum ex ultricies a. Praesent consequat dolor et ex pellentesque, quis sollicitudin diam commodo.',
      'Aliquam congue nibh in sollicitudin molestie. Nullam vulputate dignissim sapien, sed accumsan nibh malesuada a. Nunc vitae odio vel diam eleifend suscipit sit amet sit amet purus. Vestibulum tincidunt ex in aliquet dictum. Quisque blandit vulputate odio, quis finibus arcu malesuada nec.',
      'Donec a arcu aliquet, mattis augue sit amet, dignissim nulla. Proin porta diam id magna mollis tristique. Etiam ipsum nunc, pulvinar sit amet vestibulum in, mattis non ex. Nam et rutrum sem. Nunc ullamcorper maximus risus vel pharetra.',
      'Pellentesque in erat ut nibh varius dignissim. Donec finibus massa vitae egestas iaculis. In euismod varius odio sed pretium. Phasellus nec massa a est bibendum finibus a ac sapien. Morbi blandit facilisis urna et porttitor.',
      'Praesent luctus imperdiet leo, ut faucibus elit hendrerit nec. Donec ut massa tortor. Duis nec euismod felis. Proin at eros id enim pharetra imperdiet. Curabitur volutpat quis dolor tristique pellentesque. Praesent eu nibh ut justo dignissim rhoncus.',
      'Sed euismod, arcu quis dignissim faucibus, urna nibh porta nunc, vitae vestibulum quam risus at libero. Integer aliquet, velit non tempor euismod, magna nibh dictum arcu, non aliquam risus dolor a purus. Cras vitae fermentum lorem.',
      'Vivamus id felis a nibh sodales congue. Suspendisse potenti. Aenean faucibus, sapien nec convallis blandit, augue arcu semper nulla, a fermentum ligula lorem non nunc. Maecenas quis sem non ipsum posuere volutpat.',
      'Etiam nec risus nec nulla porttitor pretium. Nulla facilisi. Duis vehicula, nibh eu volutpat cursus, quam massa fermentum orci, sit amet vulputate turpis quam a mauris. Fusce ut lorem a arcu efficitur pretium in quis nunc.'
    ];
    var LOREM = P.concat(P).map(function(t){ return '<p>'+t+'</p>'; }).join('');

    /* ★ BEHAVIOUR CONTROL PANEL — switch feel + indicator finish points.
       *Finish = fraction of the buffer scroll at which that animation completes
       (before the actual switch at the far edge). Separate per element & side. */
    var CONFIG = {
      cooldownMs: 450,    // pin the new section at its default briefly after a switch
      edgeEps:    2,      // px tolerance for "reached the edge"
      indBeforeTextFinish: 0.80,
      indBeforeBarFinish:  0.80,
      indAfterTextFinish:  0.80,
      indAfterBarFinish:   0.80,
      // Switch-indicator text = GENERIC COPY + SECTION-NAME (name injected per CONTENT block).
      // "generic" = shared copy today; per-section copy can be added later without touching this.
      'switch-indicator_copy_before_generic':'↑ Späť: ',   // + <switch-indicator_section-name_before>
      'switch-indicator_copy_after_generic' :'↓ Ďalej: ',  // + <switch-indicator_section-name_after>
      labelTop:'↑ Navrch'   // first section's before-buffer (GRID #1 hook; no-op in the lab)
    };

    var menu  = document.getElementById('menu');
    var frame = document.getElementById('viewport');
    var track = document.getElementById('scrollbar');
    var thumb = document.getElementById('thumb');
    var items = [], panels = [], info = [], savedScroll = [], active = 0;
    var settling=false, settleTimer=null;
    var clamp=function(v,a,b){ return Math.min(Math.max(v,a),b); };

    SECTIONS.forEach(function(s, i){
      var last = (i === SECTIONS.length-1);
      // menu item
      var btn=document.createElement('button');
      btn.type='button'; btn.className='menu-item'; btn.textContent=s.label;
      btn.addEventListener('click', function(){ activate(i, false); });
      menu.appendChild(btn); items.push(btn);

      // panel > content > regions
      var nameBefore = (i>0)   ? SECTIONS[i-1].label : '';   // <switch-indicator_section-name_before>
      var nameAfter  = (!last) ? SECTIONS[i+1].label : '';   // <switch-indicator_section-name_after>
      var backLabel = (i>0) ? (CONFIG['switch-indicator_copy_before_generic'] + nameBefore) : CONFIG.labelTop;
      var nextLabel = (!last) ? (CONFIG['switch-indicator_copy_after_generic'] + nameAfter) : '';
      var indHTML = function(cls,label){ return '<div class="switch-indicator '+cls+'"><span class="si-label">'+label+'</span><span class="si-bar"><i></i></span></div>'; };

      var panel=document.createElement('section');
      panel.className='panel'; panel.id='panel-'+s.id; panel.setAttribute('aria-label', s.label);
      panel.innerHTML =
        '<div class="content">'+
          '<div class="buffer buffer-before">'+ indHTML('ind-back', backLabel) +'</div>'+
          '<div class="gap gap-before"></div>'+
          '<div class="core"><h2 class="panel-title">'+s.label+'</h2>'+LOREM+'</div>'+
          '<div class="gap gap-after"></div>'+
          (last ? '' : '<div class="buffer buffer-after">'+ indHTML('ind-next', nextLabel) +'</div>')+
        '</div>';
      frame.appendChild(panel); panels.push(panel);
      info.push({ indBack:panel.querySelector('.ind-back'), indNext:panel.querySelector('.ind-next') });
      savedScroll.push(null);

      panel.addEventListener('scroll', function(){ if(i===active) onScroll(); }, {passive:true});
    });

    var metricsActive = null;
    function measure(sel){ var e=panels[active].querySelector(sel); return e ? e.offsetHeight : 0; }
    function computeMetrics(){
      metricsActive = {
        bufferBefore: measure('.buffer-before'),
        gapBefore:    measure('.gap-before'),
        core:         measure('.core'),
        gapAfter:     measure('.gap-after'),
        bufferAfter:  measure('.buffer-after')   // 0 on last section
      };
    }

    function setAnim(ind, p, textFinish, barFinish){
      ind.classList.toggle('show', p > 0);
      ind.querySelector('.si-label').style.opacity = clamp(p/textFinish, 0, 1);
      ind.querySelector('.si-bar > i').style.transform = 'scaleX(' + clamp(p/barFinish, 0, 1) + ')';
    }
    function updateIndicators(){
      var vp=panels[active], m=metricsActive;
      var max=vp.scrollHeight - vp.clientHeight;
      var it=info[active];
      if(it.indBack && m.bufferBefore>0){
        var pb = clamp((m.bufferBefore - vp.scrollTop)/m.bufferBefore, 0, 1);
        setAnim(it.indBack, pb, CONFIG.indBeforeTextFinish, CONFIG.indBeforeBarFinish);
      }
      if(it.indNext && m.bufferAfter>0){
        var pa = clamp((vp.scrollTop - (max - m.bufferAfter))/m.bufferAfter, 0, 1);
        setAnim(it.indNext, pa, CONFIG.indAfterTextFinish, CONFIG.indAfterBarFinish);
      }
    }

    function readingRange(){
      var vp=panels[active], m=metricsActive;
      var max=vp.scrollHeight - vp.clientHeight;
      return { top:m.bufferBefore, bot:Math.max(m.bufferBefore, max - m.bufferAfter),
               reading:(m.gapBefore + m.core + m.gapAfter), max:max };
    }
    function updateThumb(){
      var vp=panels[active]; var r=readingRange();
      var ratio=Math.min(1, vp.clientHeight / Math.max(1, r.reading));
      var th=Math.max(24, Math.round(track.clientHeight * ratio)); thumb.style.height=th+'px';
      var span=Math.max(1, r.bot - r.top);
      var p=clamp((vp.scrollTop - r.top)/span, 0, 1);
      thumb.style.top=(p*(track.clientHeight - th)).toFixed(1)+'px';
    }

    function onScroll(){
      if(settling) return;
      var vp=panels[active], m=metricsActive;
      var max=vp.scrollHeight - vp.clientHeight;
      updateIndicators(); updateThumb();
      if(m.bufferAfter>0 && active<panels.length-1 && vp.scrollTop >= max - CONFIG.edgeEps){ activate(active+1, true); }
      else if(active>0 && vp.scrollTop <= CONFIG.edgeEps){ activate(active-1, true); }
      /* active===0 at top: no-op (reserved for the GRID #1 jump) */
    }

    function activate(i, reset){
      var prev=active;
      if(panels[prev] && panels[prev].classList.contains('active')){
        savedScroll[prev] = reset ? null : panels[prev].scrollTop;
      }
      active=i;
      items.forEach(function(b,j){ b.classList.toggle('active', j===i); });
      panels.forEach(function(p,j){ p.classList.toggle('active', j===i); });
      computeMetrics();
      var def=metricsActive.bufferBefore;
      var max=Math.max(0, panels[i].scrollHeight - panels[i].clientHeight);
      var want=(reset || savedScroll[i]==null) ? def : savedScroll[i];
      panels[i].scrollTop=clamp(want, 0, max);
      savedScroll[i]=panels[i].scrollTop;
      updateIndicators(); updateThumb();
      settling=true; panels[i].classList.add('settling');
      clearTimeout(settleTimer);
      settleTimer=setTimeout(function(){ settling=false; panels[i].classList.remove('settling'); }, CONFIG.cooldownMs);
    }

    /* thumb drag + track click -> scroll within the reading range */
    var dragging=false, startPtrY=0, startTop=0;
    function scrollFromThumb(topPx){
      var vp=panels[active]; var r=readingRange();
      var travel=track.clientHeight - thumb.clientHeight;
      var p= travel>0 ? clamp(topPx,0,travel)/travel : 0;
      vp.scrollTop = r.top + p*(r.bot - r.top);
    }
    thumb.addEventListener('pointerdown', function(e){
      e.preventDefault(); dragging=true; thumb.classList.add('dragging'); thumb.setPointerCapture(e.pointerId);
      startPtrY=e.clientY; startTop=parseFloat(thumb.style.top)||0;
    });
    thumb.addEventListener('pointermove', function(e){ if(dragging) scrollFromThumb(startTop + (e.clientY-startPtrY)); });
    thumb.addEventListener('pointerup', function(){ dragging=false; thumb.classList.remove('dragging'); });
    thumb.addEventListener('pointercancel', function(){ dragging=false; thumb.classList.remove('dragging'); });
    track.addEventListener('pointerdown', function(e){
      if(e.target===thumb) return;
      var rect=track.getBoundingClientRect();
      scrollFromThumb((e.clientY-rect.top) - thumb.clientHeight/2);
    });

    /* Desktop wheel ANYWHERE on the page scrolls the ACTIVE panel, even when the
       cursor isn't over it. When the cursor IS over the panel, native scrolling
       handles it (no double-scroll). Either way the panel's 'scroll' event fires,
       so the section-switch logic is unaffected. */
    window.addEventListener('wheel', function(e){
      if(e.ctrlKey) return;                       // leave pinch-zoom alone
      if(settling){ e.preventDefault(); return; } // stay pinned right after a switch
      var vp=panels[active];
      if(vp.contains(e.target)) return;           // over the panel → native scroll
      e.preventDefault();
      var f = e.deltaMode===1 ? 16 : (e.deltaMode===2 ? vp.clientHeight : 1);
      vp.scrollTop += e.deltaY * f;
    }, {passive:false});

    window.addEventListener('resize', function(){ computeMetrics(); updateIndicators(); updateThumb(); });
    activate(0, false);
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ computeMetrics(); updateThumb(); }); }
  })();
  </script>
</body>
</html>

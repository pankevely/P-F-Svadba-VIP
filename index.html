<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Patrícia &amp; Filip — 5. 9. 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@300;900&family=Sansita:wght@400;700&display=swap');

  /* ============================================================
     WEBSITE CHROME — black/white only (Brand Kit §2).
     Backgrounds match Notion; text swaps by prefers-color-scheme.
     ============================================================ */
  :root{
    --bg-light:          #FFFFFF;
    --text-normal-light: #3F3F3F;
    --text-accent-light: #1F1F1F;
    --bg-dark:           #191919;
    --text-normal-dark:  #C1C1C1;
    --text-accent-dark:  #E1E1E1;

    --bg:           var(--bg-light);
    --text-normal:  var(--text-normal-light);
    --text-accent:  var(--text-accent-light);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:           var(--bg-dark);
      --text-normal:  var(--text-normal-dark);
      --text-accent:  var(--text-accent-dark);
    }
  }
  /* ============================================================ */

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg);
        font-family:'Encode Sans Condensed', system-ui, sans-serif; }
  .wrap{ min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:14px;
         text-align:center; padding:40px 26px; }

  h1{ font-family:'Sansita', serif; font-weight:700; margin:0;
      font-size:clamp(34px, 7vw, 60px); line-height:1.1;
      color:var(--text-accent); }
  .date{ font-weight:900; font-size:clamp(15px, 3.5vw, 20px);
         letter-spacing:.02em; color:var(--text-accent);
         text-transform:uppercase; }
  .note{ font-weight:300; font-size:15px; color:var(--text-normal);
         opacity:.75; margin-top:6px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Patrícia &amp; Filip</h1>
    <p class="date">5. september 2026 · Rezort Partizán, Obyce</p>
    <p class="note">Pripravujeme · Wedding site in progress</p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Patrícia &amp; Filip — 5. 9. 2026</title>

<!-- ============================================================
     ★ PARALLAX CONTROL PANEL ★   — tune everything here, in one place.
     One block per plane, parallax_01 (frontmost) … parallax_07 (backmost).

     Every distance is in vh  (vh = 1% of the screen's height), so it scales
     with the window. Every knob is plain-language:

       start   : where the plane sits BEFORE any scrolling.
                   0        = its natural spot (bottom-pinned to the screen)
                   positive = pushed DOWN to begin with (partly below screen)
                   negative = lifted UP to begin with
       stop    : the TOTAL distance the plane is allowed to move, i.e. the point
                 where it STOPS reacting to scroll. The SIGN sets direction:
                   negative = moves UP as you scroll
                   positive = moves DOWN as you scroll
                 (e.g. stop:-30 = drifts up 30% of screen height, then halts.)
       speed   : how QUICKLY it reaches its 'stop'. Bigger = reacts faster
                 (reaches the stop after less scrolling). Doesn't change WHERE
                 it stops, only how soon.
       easeIn  : true  = starts moving gently (slow ramp-up from rest)
       easeOut : true  = arrives gently (slows down as it nears the stop)
                 (both true = smooth glide in AND out; both false = linear.)

     masterSpeed scales ALL speeds at once (quick global dial).
     ============================================================ -->
<script>
  window.PARALLAX_CONFIG = {
    masterSpeed: 1.0,
    layers: [
      /* parallax_01  (frontmost) */ { start: 0, stop: -14, speed: 0.10, easeIn: true, easeOut: true },
      /* parallax_02               */ { start: 0, stop:  -6, speed: 0.10, easeIn: true, easeOut: true },
      /* parallax_03               */ { start: 0, stop:   4, speed: 0.12, easeIn: true, easeOut: true },
      /* parallax_04               */ { start: 0, stop:  12, speed: 0.14, easeIn: true, easeOut: true },
      /* parallax_05               */ { start: 0, stop:  24, speed: 0.18, easeIn: true, easeOut: true },
      /* parallax_06               */ { start: 0, stop:  38, speed: 0.24, easeIn: true, easeOut: true },
      /* parallax_07  (backmost)   */ { start: 0, stop:  54, speed: 0.30, easeIn: true, easeOut: true }
    ]
  };
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Mono:wght@400;500;700&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans+Extra+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sansita:wght@400;700&display=swap');

  /* ============================================================
     WEBSITE CHROME — black/white only (Brand Kit §2).
     Background matches the page theme; text swaps by prefers-color-scheme.
     ============================================================ */
  :root{
    --bg-light:          #FFFFFF;
    --text-normal-light: #3F3F3F;
    --text-accent-light: #1F1F1F;
    --bg-dark:           #191919;
    --text-normal-dark:  #C1C1C1;
    --text-accent-dark:  #E1E1E1;

    --bg:           var(--bg-light);
    --text-normal:  var(--text-normal-light);
    --text-accent:  var(--text-accent-light);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:           var(--bg-dark);
      --text-normal:  var(--text-normal-dark);
      --text-accent:  var(--text-accent-dark);
    }
  }
  /* ============================================================ */

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  /* normal / body text = Fira Sans Extra Condensed, Light (300) */
  body{ font-family:'Fira Sans Extra Condensed', system-ui, sans-serif; font-weight:300; }

  /* -------- LAYER: bg (back) — solid theme background -------- */
  .bg{ position:fixed; inset:0; background:var(--bg); z-index:1; }

  /* -------- LAYER: content_core (middle) — the only thing that scrolls -------- */
  .content_core{ position:relative; z-index:2; }

  /* names: three centered lines; block's vertical middle sits at 33% viewport height */
  .names{
    height:66vh;                 /* centered within 66vh => middle at 33vh */
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:0.02em; line-height:0.98;
    text-align:center; padding:0 24px;
  }
  .name{                         /* "Patrícia" / "Filip" — Sansita 700, accent tier */
    font-family:'Sansita', serif; font-weight:700;
    color:var(--text-accent);
    font-size:clamp(44px, 9vw, 120px);
  }
  .amp{                          /* "&" — Fira Sans Condensed, ExtraLight (200), normal tier */
    font-family:'Fira Sans Condensed', system-ui, sans-serif; font-weight:200;
    color:var(--text-normal);
    font-size:clamp(30px, 6vw, 80px); line-height:1;
  }

  /* tall empty div so the page scrolls well past one screen (>= 3x viewport height) */
  .scroll_spacer{ height:320vh; }

  /* -------- LAYER: parallax (front) — 7 stacked planes pinned to viewport bottom -------- */
  .parallax{
    position:fixed; left:0; right:0; bottom:0; height:100vh;
    z-index:3; pointer-events:none; overflow:hidden;
  }
  .parallax img{
    position:absolute; left:50%; bottom:0;
    width:100%; height:auto;
    transform:translate3d(-50%,0,0);
    will-change:transform; display:block;
    -webkit-user-select:none; user-select:none;
  }
  /* z-order within the stack: 01 frontmost … 07 backmost */
  .p1{ z-index:37; } .p2{ z-index:36; } .p3{ z-index:35; } .p4{ z-index:34; }
  .p5{ z-index:33; } .p6{ z-index:32; } .p7{ z-index:31; }
</style>
</head>
<body>

  <!-- bg layer -->
  <div class="bg"></div>

  <!-- content_core layer (scrolls) -->
  <div class="content_core">
    <div class="names">
      <span class="name">Patrícia</span>
      <span class="amp">&amp;</span>
      <span class="name">Filip</span>
    </div>
    <div class="scroll_spacer"><!-- empty test spacer, >= 3x screen height --></div>
  </div>

  <!-- parallax layer (front) — parallax_01 top of stack … parallax_07 bottom -->
  <div class="parallax" aria-hidden="true">
    <img class="p1" src="assets/img/parallax_01.webp" alt="">
    <img class="p2" src="assets/img/parallax_02.webp" alt="">
    <img class="p3" src="assets/img/parallax_03.webp" alt="">
    <img class="p4" src="assets/img/parallax_04.webp" alt="">
    <img class="p5" src="assets/img/parallax_05.webp" alt="">
    <img class="p6" src="assets/img/parallax_06.webp" alt="">
    <img class="p7" src="assets/img/parallax_07.webp" alt="">
  </div>

  <!-- ============ PARALLAX ENGINE (reads the control panel above) ============ -->
  <script>
    (function(){
      var cfg  = window.PARALLAX_CONFIG || { masterSpeed:1, layers:[] };
      var imgs = Array.prototype.slice.call(document.querySelectorAll('.parallax img'));

      // easing shapes for the movement (progress p is 0..1 toward the stop)
      function ease(p, i, o){
        if(i && o) return p*p*(3-2*p);        // smooth in-out (smoothstep)
        if(i)      return p*p;                 // ease-in
        if(o)      return 1-(1-p)*(1-p);       // ease-out
        return p;                              // linear
      }

      var ticking = false;
      function apply(){
        var vh = window.innerHeight;
        var y  = window.scrollY || window.pageYOffset || 0;
        var m  = (cfg.masterSpeed == null ? 1 : cfg.masterSpeed);

        for (var idx=0; idx<imgs.length; idx++){
          var L = cfg.layers[idx] || {};
          var startPx = (L.start || 0) / 100 * vh;   // initial offset
          var stopPx  = (L.stop  || 0) / 100 * vh;   // total travel (signed)
          var denom   = Math.abs(stopPx) || 1;
          var prog    = Math.min(Math.max((L.speed || 0) * m * y / denom, 0), 1);
          var eased   = ease(prog, !!L.easeIn, !!L.easeOut);
          var disp    = startPx + stopPx * eased;
          imgs[idx].style.transform = 'translate3d(-50%,' + disp.toFixed(2) + 'px,0)';
        }
        ticking = false;
      }
      function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(apply); } }

      window.addEventListener('scroll', onScroll, {passive:true});
      window.addEventListener('resize', onScroll, {passive:true});
      apply();
    })();
  </script>
</body>
</html>

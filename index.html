<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Patrícia &amp; Filip — 5. 9. 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@300;900&family=Sansita:wght@400;700&display=swap');

  /* ============================================================
     WEBSITE CHROME — black/white only (Brand Kit §2).
     Backgrounds match the page theme; text swaps by prefers-color-scheme.
     ============================================================ */
  :root{
    --bg-light:          #FFFFFF;
    --text-normal-light: #3F3F3F;
    --text-accent-light: #1F1F1F;
    --bg-dark:           #191919;
    --text-normal-dark:  #C1C1C1;
    --text-accent-dark:  #E1E1E1;

    --bg:           var(--bg-light);
    --text-normal:  var(--text-normal-light);
    --text-accent:  var(--text-accent-light);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:           var(--bg-dark);
      --text-normal:  var(--text-normal-dark);
      --text-accent:  var(--text-accent-dark);
    }
  }
  /* ============================================================ */

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:'Encode Sans Condensed', system-ui, sans-serif; }

  /* -------- LAYER: bg (back) — solid theme background -------- */
  .bg{
    position:fixed; inset:0;
    background:var(--bg);
    z-index:1;
  }

  /* -------- LAYER: content_core (middle) — the only thing that scrolls -------- */
  .content_core{
    position:relative;
    z-index:2;
  }
  /* names block: horizontally centered, its vertical middle at 33% of viewport height */
  .names{
    height:66vh;                 /* centered within 66vh => middle sits at 33vh */
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.28em;
    padding:0 24px;
    text-align:center;
    line-height:1;
  }
  .name{                         /* "Patrícia" / "Filip" — Sansita 700, accent tier */
    font-family:'Sansita', serif;
    font-weight:700;
    color:var(--text-accent);
    font-size:clamp(40px, 8vw, 104px);
  }
  .amp{                          /* "&" — Encode Sans Condensed 300, normal tier */
    font-family:'Encode Sans Condensed', system-ui, sans-serif;
    font-weight:300;
    color:var(--text-normal);
    font-size:clamp(34px, 6.5vw, 84px);
  }
  /* tall empty div so the page scrolls well past one screen (>= 3x viewport height) */
  .scroll_spacer{
    height:320vh;
  }

  /* -------- LAYER: parallax (front) — 7 stacked planes pinned to viewport bottom -------- */
  .parallax{
    position:fixed;
    left:0; right:0; bottom:0;
    height:100vh;
    z-index:3;
    pointer-events:none;         /* never intercept scroll / clicks */
    overflow:hidden;
  }
  .parallax img{
    position:absolute;
    left:50%;
    bottom:0;
    width:100%;
    height:auto;
    transform:translate3d(-50%,0,0);
    will-change:transform;
    display:block;
    -webkit-user-select:none; user-select:none;
  }
  /* z-order within the stack: 01 frontmost … 07 backmost */
  .p1{ z-index:37; } .p2{ z-index:36; } .p3{ z-index:35; } .p4{ z-index:34; }
  .p5{ z-index:33; } .p6{ z-index:32; } .p7{ z-index:31; }
</style>
</head>
<body>

  <!-- bg layer -->
  <div class="bg"></div>

  <!-- content_core layer (scrolls) -->
  <div class="content_core">
    <div class="names">
      <span class="name">Patrícia</span>
      <span class="amp">&amp;</span>
      <span class="name">Filip</span>
    </div>
    <div class="scroll_spacer"><!-- empty test spacer, >= 3x screen height --></div>
  </div>

  <!-- parallax layer (front) — parallax_01 top of stack … parallax_07 bottom -->
  <div class="parallax" aria-hidden="true">
    <img class="p1" src="assets/img/parallax_01.webp" alt="">
    <img class="p2" src="assets/img/parallax_02.webp" alt="">
    <img class="p3" src="assets/img/parallax_03.webp" alt="">
    <img class="p4" src="assets/img/parallax_04.webp" alt="">
    <img class="p5" src="assets/img/parallax_05.webp" alt="">
    <img class="p6" src="assets/img/parallax_06.webp" alt="">
    <img class="p7" src="assets/img/parallax_07.webp" alt="">
  </div>

  <script>
    /* Parallax on scroll — "camera descending while aimed up":
       back planes (higher NN) move faster and DOWN, front planes (lower NN)
       move slower and UP. coef is per-plane px-shift per px scrolled.
       index 0..6 == parallax_01..07 */
    (function(){
      var imgs = Array.prototype.slice.call(document.querySelectorAll('.parallax img'));
      var coef = [-0.10, -0.02, 0.06, 0.14, 0.24, 0.36, 0.50];
      var ticking = false;
      function apply(){
        var y = window.scrollY || window.pageYOffset || 0;
        for (var i=0;i<imgs.length;i++){
          imgs[i].style.transform = 'translate3d(-50%,' + (coef[i]*y).toFixed(2) + 'px,0)';
        }
        ticking = false;
      }
      function onScroll(){
        if(!ticking){ ticking = true; window.requestAnimationFrame(apply); }
      }
      window.addEventListener('scroll', onScroll, {passive:true});
      window.addEventListener('resize', onScroll, {passive:true});
      apply();
    })();
  </script>
</body>
</html>

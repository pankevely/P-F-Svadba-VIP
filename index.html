<!-- ============================================================================
     ★ CONTROL PANEL SECTION — GENERAL CONTROLS ★
     Site-wide switches.
       defaultTheme : theme the site OPENS in before the visitor toggles
                      ('light' or 'dark'). Orientation-independent (no _h/_v).
       fillParallaxGaps     : parallax "fill the gaps" — raise a plane's height so its
                      width reaches the screen sides (only ever RAISES height,
                      never lowers your tuned values).
       maxParallaxHeight100 : cap parallax height at 100% of screen height (stops a plane
                      from exceeding the screen on extreme aspect ratios).
     ORIENTATION: fillParallaxGaps / maxParallaxHeight100 have _h (landscape) and _v (portrait)
     variants; defaultTheme is a single global value.
     ============================================================================ -->
<script>
  window.GENERAL = {

    defaultTheme: 'light',

    fillParallaxGaps_h: true,
    fillParallaxGaps_v: true,

    maxParallaxHeight100_h: true,
    maxParallaxHeight100_v: true
  };
</script>

<!-- Set the theme BEFORE first paint (from GENERAL.defaultTheme) so there's no flash. -->
<script>
  try {
    var d = (window.GENERAL && window.GENERAL.defaultTheme) || 'light';
    document.documentElement.setAttribute('data-theme', localStorage.getItem('pf-theme') || d);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>

<!-- ============================================================================
     ★ CONTROL PANEL SECTION — PARALLAX CONTROLS ★
     Parallax planes only. parallax_01 (frontmost) … 07 (backmost). Units = dvh.

     SIZE:
       masterHeight : image HEIGHT as % of screen height, pinned to the frame
                      bottom (width follows the image's aspect, so it may overflow
                      the sides or leave gaps). e.g. 33 = each plane is 33% tall.
       heightAlt    : per-plane tweak; final height = masterHeight + heightAlt.

     HORIZONTAL ANCHOR (left-right placement when the image is wider than the screen):
       anchorImageX  : the point ON THE IMAGE (% of image width; 50 = centre).
       anchorScreenX : where that point lands ON SCREEN (% of screen width).
                       50/50 = centred crop. e.g. 75/75 keeps the image's 75% point
                       at 75% of the screen. GLOBAL, so all planes stay aligned.

     MOTION (image's BOTTOM edge; + = ABOVE frame bottom = UP, − = BELOW = DOWN):
       start        : position at page TOP (no scroll). 0 = on the frame bottom.
       distance     : how far it MOVES from start by max scroll
                      (start -2 + distance 3 => ends 1 above the frame bottom).
       acceleration : finish earlier. 0 = at page bottom; 16 = at 84%; neg = 0; cap 99 = 1%.
       easeIn/easeOut : true = start / arrive gently.

     BLUR (its own timeline):
       blurStart / blurEnd : blur px at page top / at max scroll (interpolates).
       blurAcceleration    : finish the blur change earlier (same 0..99 rule).

     GLOBALS:
       masterHeight, masterStart, masterDistance, masterAcceleration (added to each
       plane's matching value); anchorImageX, anchorScreenX (whole stack, no per-plane).

     ORIENTATION: every parameter has _h (landscape) and _v (portrait) variants;
     _h on landscape screens, _v on portrait (square = vertical).
     ============================================================================ -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Mono:wght@400;500;700&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans+Extra+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sansita:wght@400;700&display=swap');

  /* ============================================================
     WEBSITE CHROME — black/white only (Brand Kit §2).
     BOTH palettes kept; active one chosen by data-theme. Default = LIGHT.
     ============================================================ */
  :root{
    --bg-light:          #FFFFFF;
    --text-normal-light: #3F3F3F;
    --text-accent-light: #1F1F1F;
    --bg-dark:           #191919;
    --text-normal-dark:  #C1C1C1;
    --text-accent-dark:  #E1E1E1;

    --bg:          var(--bg-light);
    --text-normal: var(--text-normal-light);
    --text-accent: var(--text-accent-light);
  }
  :root[data-theme="light"]{
    --bg:          var(--bg-light);
    --text-normal: var(--text-normal-light);
    --text-accent: var(--text-accent-light);
  }
  :root[data-theme="dark"]{
    --bg:          var(--bg-dark);
    --text-normal: var(--text-normal-dark);
    --text-accent: var(--text-accent-dark);
  }
  /* ============================================================ */

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:'Fira Sans Extra Condensed', system-ui, sans-serif; font-weight:300; }

  /* ---- FIXED layers (don't scroll) ------------------------------------ */
  .bg{ position:fixed; inset:0; background:var(--bg); pointer-events:none; }

  /* parallax plane — full-screen fixed frame; the webp is pinned to its bottom.
     Sizing (height + width) is set by JS from masterHeight/heightAlt.
     Motion = translate the FRAME; blur = on the img. */
  .parallax{ position:fixed; inset:0; pointer-events:none; will-change:transform; backface-visibility:hidden; }
  .parallax > img{
    position:absolute; left:50%; bottom:0;
    width:auto; height:33dvh;                 /* JS overrides with the tuned height */
    transform:translateX(-50%);
    display:block; -webkit-user-select:none; user-select:none;
  }

  /* controls — full-screen fixed frame; click-through except its buttons */
  .controls{ position:fixed; inset:0; pointer-events:none; }
  .theme-toggle{
    position:absolute; top:18px; right:18px;
    width:34px; height:34px; border-radius:50%;
    background:var(--text-accent);
    border:1px solid var(--bg);
    box-shadow:0 0 0 1px var(--text-accent);
    cursor:pointer; pointer-events:auto; padding:0;
    transition:background .2s ease;
  }

  /* ---- SCROLLING layers (normal flow) --------------------------------- */
  /* section_1_1 — one full screen; names centred horizontally, in the top third */
  /* Section 1 hero — three thirds (section_1_1/2/3), each holding inner flex boxes.
     Columns + inner flexes are sized/ordered/aligned/padded by JS from HERO CONTROLS.
     H: columns side-by-side.  V: columns stacked. */
  .s1{ display:flex; width:100%; height:100vh; height:100dvh; height:var(--appvh,100dvh); align-items:stretch; }
  @media (orientation: portrait){ .s1{ flex-direction:column; } }
  .s1col{ position:relative; flex:1 1 0; overflow:hidden; min-width:0; min-height:0;
          display:flex; flex-direction:column; }   /* JS sets flex (ratio) + order */
  /* cell = the ratio-sized area (never moves; JS sets flex + order) */
  .hflex{ flex:1 1 0; position:relative; min-width:0; min-height:0; overflow:hidden; }
  /* liner = fills the cell; carries padding + 9-point align (JS). Padding insets the
     content WITHIN the cell, so the cell's ratio size never changes. */
  .hliner{ position:absolute; inset:0; box-sizing:border-box; display:flex;
           align-items:center; justify-content:center; }

  /* P+F names group — scaled as ONE unit (by JS) to fit its flex box */
  .names{
    text-align:center; line-height:0.98;
    display:flex; flex-direction:column; align-items:center; gap:0.02em;
    font-size:100px;                  /* reference; JS overrides */
  }
  .name{ font-family:'Sansita', serif; font-weight:700;
         color:var(--text-accent); font-size:1em; }               /* names = base size */
  .amp{  font-family:'Fira Sans Condensed', system-ui, sans-serif; font-weight:200;
         color:var(--text-normal); font-size:0.66em; line-height:1; }  /* & = 66% of names */

  /* date + location text — sizes set by JS as fractions of the & size */
  .hero-date,
  .hero-location{ font-family:'Fira Sans Extra Condensed', system-ui, sans-serif; font-weight:100;
                  color:var(--text-accent); line-height:1.15; text-align:center; }
  /* Dotazník button */
  .hero-btn{ font-family:'Fira Sans Extra Condensed', system-ui, sans-serif; font-weight:500;
             color:var(--text-accent); background:transparent;
             border:1px solid var(--text-accent); border-radius:6px;
             line-height:1; cursor:pointer; white-space:nowrap; }
  /* scroll box (auto-scroll arrows added later) */
  .hero-scroll{ width:100%; height:100%; }

  /* section_2 row — three FULL-HEIGHT, one-third-width frames.
     On PORTRAIT screens they stack vertically (1 → 2 → 3). */
  .sections{ display:flex; width:100%; }
  .section{
    position:relative; flex:1 1 0; min-width:0;
    height:100vh; height:100dvh; height:var(--appvh,100dvh);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-accent); font-weight:300;
    font-size:clamp(18px, 3vw, 40px); letter-spacing:.01em;
  }
  @media (orientation: portrait){
    .sections{ flex-direction:column; }
    /* stacked: each section is its OWN full screen (don't let flex-basis:0 collapse it) */
    .section{ width:100%; flex:0 0 auto; }
  }
</style>

  <div class="parallax" data-layer="parallax_07"><img src="assets/img/parallax_07.webp" alt=""></div>

  <div class="controls" data-layer="controls">
    <button class="theme-toggle" type="button" aria-label="Prepnúť svetlý/tmavý režim"></button>
  </div>

  <!-- ===== SCROLLING layers (normal document flow) ===== -->
  <!-- screen 1 -->
  <!-- Section 1 (hero): three thirds, each with inner flex boxes -->
  <div class="s1">
    <div class="s1col" data-layer="section_1_1">
      <div class="hflex" data-flex="date"><div class="hliner"><span class="hero-date">5. september 2026</span></div></div>
    </div>
    <div class="s1col" data-layer="section_1_2">
      <div class="hflex" data-flex="pf">
        <div class="hliner">
          <div class="names">
            <span class="name">Patrícia</span>
            <span class="amp">&amp;</span>
            <span class="name">Filip</span>
          </div>
        </div>
      </div>
      <div class="hflex" data-flex="buttonQ"><div class="hliner"><button class="hero-btn" type="button"><span class="hero-btn-text">Dotazník</span></button></div></div>
      <div class="hflex" data-flex="buttonScroll"><div class="hliner"><span class="hero-scroll" style="width:34px;height:34px;border-radius:50%;background:var(--text-accent);display:block;"></span></div></div>
    </div>
    <div class="s1col" data-layer="section_1_3">
      <div class="hflex" data-flex="location"><div class="hliner"><span class="hero-location">Rezort Partizán • Obyce, Zlaté Moravce</span></div></div>
    </div>
  </div>

  <!-- screen 2 -->
  <div class="sections">
    <div class="section" data-layer="section_2_1">section_2_1</div>
    <div class="section" data-layer="section_2_2">section_2_2</div>
    <div class="section" data-layer="section_2_3">section_2_3</div>
  </div>

  <!-- ============ ENGINE (reads the control-panel sections above) ============ -->
  <script>
    (function(){
      var LAYERS   = window.LAYERS   || {};
      var PARALLAX = window.PARALLAX || {};
      var SECTIONS = window.SECTIONS || {};
      var GENERAL  = window.GENERAL  || {};
      var HERO     = window.HERO     || {};

      // ---- STABLE viewport size: frozen so the mobile URL bar (which changes
      //      innerHeight on scroll) can't reflow the layout. Updated only on a
      //      real width / orientation change. ----
      var APPW = window.innerWidth, APPH = window.innerHeight;
      function setVH(){ APPW = window.innerWidth; APPH = window.innerHeight;
                        document.documentElement.style.setProperty('--appvh', APPH + 'px'); }
      setVH();

      function el(name){ return document.querySelector('[data-layer="' + name + '"]'); }
      // square counts as vertical (height >= width)
      function vertical(){ return window.innerHeight >= window.innerWidth; }
      // read the orientation-active variant of a base parameter
      function pick(obj, base){ if(!obj) return undefined; return obj[base + (vertical() ? '_v' : '_h')]; }

      function ease(p,i,o){ if(i&&o) return p*p*(3-2*p); if(i) return p*p; if(o) return 1-(1-p)*(1-p); return p; }

      var planes = Object.keys(PARALLAX)
        .filter(function(k){ return /^parallax_/.test(k); })
        .map(function(k){ var f = el(k); return { cfg:PARALLAX[k], frame:f, img: f ? f.querySelector('img') : null }; });

      // ---- LAYOUT: orientation-dependent, NOT scroll-dependent ----
      //      z-index + visibility (all layers), section BG colour, parallax image size
      function layout(){
        var vh = APPH;

        Object.keys(LAYERS).forEach(function(name){
          var node = el(name); if(!node) return;
          var z = pick(LAYERS[name], 'zIndex');     if(z != null) node.style.zIndex  = z;
          var v = pick(LAYERS[name], 'visibility'); if(v != null) node.style.opacity = v / 100;
        });

        Object.keys(SECTIONS).forEach(function(name){
          var node = el(name); if(!node) return;
          var c = pick(SECTIONS[name], 'BG'); if(c != null) node.style.backgroundColor = c;
        });

        var mH   = pick(PARALLAX, 'masterHeight') || 0;
        var fill = !!pick(GENERAL, 'fillParallaxGaps');       // GENERAL CONTROLS toggle
        var cap  = !!pick(GENERAL, 'maxParallaxHeight100');   // GENERAL CONTROLS toggle
        var vw   = APPW;
        var aImg = pick(PARALLAX, 'anchorImageX');  if(aImg == null) aImg = 50;
        var aScr = pick(PARALLAX, 'anchorScreenX'); if(aScr == null) aScr = 50;
        planes.forEach(function(p){
          if(!p.img) return;
          var hPct = mH + (pick(p.cfg, 'heightAlt') || 0);   // % of screen height
          // FILL THE GAPS: raise height so the image width reaches the sides.
          // imgAspect read LIVE from the actual image (needs it loaded).
          if(fill && p.img.naturalWidth && p.img.naturalHeight){
            var minPct = 100 * (vw / vh) / (p.img.naturalWidth / p.img.naturalHeight);
            if(hPct < minPct) hPct = minPct;
          }
          if(cap && hPct > 100) hPct = 100;                  // never taller than the screen
          p.img.style.height    = (hPct / 100 * vh).toFixed(1) + 'px';
          p.img.style.width     = 'auto';
          p.img.style.left      = aScr + '%';                   // horizontal anchor: screen point
          p.img.style.transform = 'translateX(-' + aImg + '%)'; // horizontal anchor: image point
        });

        // ---- HERO (Section 1): 3 columns (thirds) x inner flexes, all from HERO CONTROLS ----
        var hero = document.querySelector('.s1');
        if(hero){
          var vw = APPW;
          var aI = function(v){ return v === 't' ? 'flex-start' : (v === 'b' ? 'flex-end' : 'center'); };
          var jC = function(h){ return h === 'l' ? 'flex-start' : (h === 'r' ? 'flex-end' : 'center'); };
          var COLS = HERO.columns || {};
          Object.keys(COLS).forEach(function(nm){
            var col = document.querySelector('.s1col[data-layer="' + nm + '"]'); if(!col) return;
            var c = COLS[nm];
            col.style.flex  = (pick(c,'flex') || 0) + ' 1 0';   // main-axis ratio share
            col.style.order = (pick(c,'order') || 0);
          });

          var FL = HERO.flexes || {};
          Object.keys(FL).forEach(function(nm){
            var fx = hero.querySelector('.hflex[data-flex="' + nm + '"]'); if(!fx) return;
            var f = FL[nm];
            fx.style.flex  = (pick(f,'flex') || 0) + ' 1 0';    // cell = ratio share (never moves)
            fx.style.order = (pick(f,'order') || 0);
            var ln = fx.querySelector('.hliner'); if(!ln) return;
            var a = String(pick(f,'align') || 'cc').toLowerCase();
            ln.style.alignItems     = aI(a.charAt(0));
            ln.style.justifyContent = jC(a.charAt(1));
            ln.style.paddingTop    = ((pick(f,'padT') || 0) / 100 * vh).toFixed(1) + 'px';
            ln.style.paddingBottom = ((pick(f,'padB') || 0) / 100 * vh).toFixed(1) + 'px';
            ln.style.paddingLeft   = ((pick(f,'padL') || 0) / 100 * vw).toFixed(1) + 'px';
            ln.style.paddingRight  = ((pick(f,'padR') || 0) / 100 * vw).toFixed(1) + 'px';
          });

          // P+F group scaled to fit its flex box (BOTH height and available width)
          var names = hero.querySelector('.names');
          var ampPx = 0;
          if(names){
            var pfBox = hero.querySelector('.hflex[data-flex="pf"] .hliner');
            names.style.fontSize = '100px';
            var h0 = names.offsetHeight || 1, w0 = names.offsetWidth || 1;
            var availH = h0, availW = w0;
            if(pfBox){
              var cs = getComputedStyle(pfBox);
              availH = pfBox.clientHeight - (parseFloat(cs.paddingTop)  || 0) - (parseFloat(cs.paddingBottom) || 0);
              availW = pfBox.clientWidth  - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight)  || 0);
            }
            var scale = Math.min(availH / h0, availW / w0);
            if(!(scale > 0)) scale = availH / h0;
            names.style.fontSize = (100 * scale).toFixed(2) + 'px';
            var ampEl = names.querySelector('.amp');
            if(ampEl) ampPx = parseFloat(getComputedStyle(ampEl).fontSize) || 0;
          }
          var frac = function(k, def){ var v = pick(HERO, k); return (v == null ? def : v) / 100 * ampPx; };
          var dEl = hero.querySelector('.hero-date');     if(dEl) dEl.style.fontSize = frac('dateScale', 33).toFixed(2) + 'px';
          var lEl = hero.querySelector('.hero-location'); if(lEl) lEl.style.fontSize = frac('locationScale', 33).toFixed(2) + 'px';
          var btn = hero.querySelector('.hero-btn');
          if(btn){
            btn.style.fontSize = frac('buttonScale', 50).toFixed(2) + 'px';
            var txt = btn.querySelector('.hero-btn-text'); var textH = txt ? txt.offsetHeight : 0;
            var bpad = pick(HERO, 'buttonPad'); var pad = (bpad == null ? 25 : bpad) / 100 * textH;
            btn.style.padding = pad.toFixed(1) + 'px ' + pad.toFixed(1) + 'px';
          }
        }
      }

      // ---- APPLY: scroll-driven motion + blur ----
      var ticking = false;
      function apply(){
        var vh = APPH;
        var y  = window.scrollY || window.pageYOffset || 0;
        var maxScroll = Math.max(1, document.documentElement.scrollHeight - vh);
        var mSt  = pick(PARALLAX, 'masterStart')        || 0;
        var mDi  = pick(PARALLAX, 'masterDistance')     || 0;
        var mAcc = pick(PARALLAX, 'masterAcceleration') || 0;
        var prog = Math.min(Math.max(y / maxScroll, 0), 1);   // shared raw scroll progress 0..1

        planes.forEach(function(p){
          if(!p.frame) return;
          var L = p.cfg;
          var startPos = (pick(L,'start')    || 0) + mSt;   // dvh above frame bottom @ page top
          var travel   = (pick(L,'distance') || 0) + mDi;   // how far it MOVES from start (dvh)

          var accel = (pick(L,'acceleration') || 0) + mAcc;
          if(accel < 0)  accel = 0;
          if(accel > 99) accel = 99;
          var t = Math.min(prog / ((100 - accel) / 100), 1);

          var posDvh = startPos + travel * ease(t, !!pick(L,'easeIn'), !!pick(L,'easeOut'));
          p.frame.style.transform = 'translateY(' + (-(posDvh / 100) * vh).toFixed(2) + 'px)';

          // blur: blurStart -> blurEnd on its OWN acceleration
          var bAcc = (pick(L,'blurAcceleration') || 0);
          if(bAcc < 0)  bAcc = 0;
          if(bAcc > 99) bAcc = 99;
          var bt = Math.min(prog / ((100 - bAcc) / 100), 1);
          var b0 = pick(L,'blurStart') || 0, b1 = pick(L,'blurEnd') || 0;
          if(p.img) p.img.style.filter = 'blur(' + (b0 + (b1 - b0) * bt).toFixed(2) + 'px)';
        });
        ticking = false;
      }
      function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(apply); } }

      window.addEventListener('scroll', onScroll, {passive:true});
      window.addEventListener('resize', function(){
        var flip = (window.innerHeight >= window.innerWidth) !== (APPH >= APPW);
        if(window.innerWidth !== APPW || flip){ setVH(); layout(); }   // genuine layout change only
        onScroll();
      }, {passive:true});
      window.addEventListener('orientationchange', function(){ setVH(); layout(); onScroll(); });

      // images may not be measured yet on first paint; re-run layout when each loads
      planes.forEach(function(p){ if(p.img && !p.img.complete) p.img.addEventListener('load', layout); });
      layout();
      apply();
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(layout); }

      // ---- theme toggle (default light; remembers choice) ----
      var root = document.documentElement;
      var btn  = document.querySelector('.theme-toggle');
      if(btn){
        btn.addEventListener('click', function(){
          var next = (root.getAttribute('data-theme') === 'light') ? 'dark' : 'light';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('pf-theme', next); } catch(e){}
        });
      }
    })();
  </script>
</body>
</html>
